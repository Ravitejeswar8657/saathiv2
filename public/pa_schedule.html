<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Schedule · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/js/saathi-ui.js" defer></script>
<script src="/sidebar.js" defer></script>
<style>
.back-link{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--accent);text-decoration:none}
.back-link:hover{color:var(--accent-hover)}
.card{margin-bottom:16px}
.section-title{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:14px}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-group textarea{min-height:80px}
.btn-block{width:100%;justify-content:center}
.nearby-result{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-top:16px;box-shadow:var(--shadow-sm)}
.nearby-result h4{font-size:14px;font-weight:600;color:var(--stone-700);margin-bottom:4px}
.nearby-result .hint{font-size:12px;color:var(--stone-500);margin-bottom:12px}
.nearby-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.nearby-item:last-child{border:none}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;margin-left:6px}
.tag-t1{background:#fef3c7;color:#92400e}
.tag-t2{background:var(--info-bg);color:var(--info)}
.tag-t3{background:var(--neutral-bg);color:var(--neutral)}
.phone-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.phone-link:hover{text-decoration:underline}
.event-card{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;background:#fff;box-shadow:var(--shadow-sm)}
.event-name{font-size:14px;font-weight:600;color:var(--ink)}
.event-meta{font-size:12px;color:var(--stone-500);margin-top:2px}
.delete-icon-btn{background:none;border:none;color:var(--stone-400);cursor:pointer;padding:6px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
.delete-icon-btn:hover{color:var(--danger);background:var(--danger-bg)}
.delete-icon-btn [data-lucide]{width:16px;height:16px}
.event-contacts{margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6}
.event-contacts-label{font-size:12px;font-weight:600;color:var(--stone-500);margin-bottom:6px}
.time-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.time-picker select{width:auto;padding:10px 8px}
.time-confirmed{font-size:12px;color:var(--success);font-weight:600;margin-top:5px}
.prep-link-btn{display:inline-block;background:#fff;border:1px solid #d4d4d4;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;margin-top:8px}
.prep-link-btn:hover{background:var(--accent-bg)}
@media(max-width:480px){.cal-day{min-height:36px;font-size:11px}}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="page-title">MP Schedule &amp; Events</h1>
      <p class="page-subtitle">Schedule events and find nearby priority contacts.</p>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Add new event</div>
    <div class="form-row">
      <div class="form-group"><label>Event name *</label><input id="sch-name" placeholder="e.g. Public Meeting"></div>
      <div class="form-group"><label>Date *</label><input id="sch-date" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Time</label>
        <div class="time-picker">
          <select id="sch-hour">
            <option value="">Hr</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
          </select>
          <select id="sch-min">
            <option value="00">00</option><option value="15">15</option>
            <option value="30">30</option><option value="45">45</option>
          </select>
          <select id="sch-ampm"><option>AM</option><option>PM</option></select>
          <button type="button" class="btn btn-primary btn-sm" onclick="confirmTime()">OK</button>
        </div>
        <div id="time-confirmed" class="time-confirmed"></div>
        <input type="hidden" id="sch-time" value=""/>
      </div>
      <div class="form-group"><label>Mandal *</label>
        <select id="sch-mandal" onchange="onMandalChange()">
          <option value="">Select Mandal</option>
        </select>
        <input id="sch-mandal-custom" type="text" placeholder="Enter mandal name" style="display:none;margin-top:6px">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Village</label>
        <select id="sch-village" disabled>
          <option value="">Select Mandal first</option>
        </select>
        <input id="sch-village-custom" type="text" placeholder="Enter village name" style="display:none;margin-top:6px">
      </div>
      <div class="form-group"><label>Event type</label>
        <select id="sch-event-type">
          <option value="">Select type</option>
          <option>Public Meeting</option><option>Grievance Camp</option>
          <option>Inauguration</option><option>Condolence Visit</option>
          <option>Party Cadre Meeting</option><option>Festival</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="sch-desc" placeholder="Agenda or notes..."></textarea></div>
    <button class="btn btn-primary btn-block" id="schedule-submit-btn" onclick="submitSchedule()">
      <i data-lucide="calendar-plus" style="width:16px;height:16px"></i> Save & Find Nearby Contacts
    </button>
  </div>

  <div id="schedule-result"></div>

  <div class="card" style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div class="form-group" style="margin-bottom:0;flex:1;min-width:160px">
      <label>Download brief PDF for</label>
      <input type="date" id="pdf-date">
    </div>
    <button class="btn btn-primary" onclick="downloadBriefPdf()">Download Final Brief PDF</button>
  </div>

  <div class="card" id="calendar-card">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&lsaquo;</button>
      <div>
        <span id="cal-month-label" class="cal-month-label"></span>
        <button class="cal-today-btn" onclick="jumpToday()">Today</button>
      </div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:4px"></div>
    <div class="cal-filter-bar" id="cal-filter-bar" style="display:none">
      <span id="cal-filter-label"></span>
      <button class="cal-clear-btn" onclick="clearDateFilter()">Show all</button>
    </div>
  </div>

  <div id="upcoming-list"></div>
</div>

<script>
let villagesByMandal = {};
let allSchedule = [];
let selectedDateFilter = null;

function getTodayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

const [__ty, __tm] = getTodayIST().split('-').map(Number);
let calViewYear = __ty;
let calViewMonth = __tm - 1;

document.addEventListener('DOMContentLoaded', async () => {
  lucide.createIcons();
  const pdfDateInput = document.getElementById('pdf-date');
  if (pdfDateInput && !pdfDateInput.value) {
    pdfDateInput.value = getTodayIST();
  }
  await loadFilterOptions();
});

async function loadFilterOptions() {
  try {
    const r = await fetch('/api/filter-options');
    const data = await r.json();
    villagesByMandal = data.villagesByMandal || {};
    const mandalSel = document.getElementById('sch-mandal');
    (data.mandals || []).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      mandalSel.appendChild(opt);
    });
    mandalSel.appendChild(new Option('Others', '__other__'));
  } catch(e) {
    console.error('Failed to load filter options', e);
  }
}

function onMandalChange() {
  const mandalVal = document.getElementById('sch-mandal').value;
  const customMandal = document.getElementById('sch-mandal-custom');
  customMandal.style.display = mandalVal === '__other__' ? 'block' : 'none';

  const villageSel = document.getElementById('sch-village');
  const customVillage = document.getElementById('sch-village-custom');
  villageSel.innerHTML = '';
  customVillage.style.display = 'none';

  if (!mandalVal || mandalVal === '__other__') {
    villageSel.appendChild(new Option(mandalVal === '__other__' ? 'Select village (optional)' : 'Select Mandal first', ''));
    villageSel.disabled = mandalVal !== '__other__';
    if (mandalVal === '__other__') villageSel.appendChild(new Option('Others', '__other__'));
    return;
  }
  const villages = villagesByMandal[mandalVal] || [];
  villageSel.appendChild(new Option('Select village (optional)', ''));
  villages.forEach(v => villageSel.appendChild(new Option(v, v)));
  villageSel.appendChild(new Option('Others', '__other__'));
  villageSel.disabled = false;
}

document.addEventListener('change', e => {
  if (e.target.id === 'sch-village') {
    document.getElementById('sch-village-custom').style.display =
      e.target.value === '__other__' ? 'block' : 'none';
  }
});

function downloadBriefPdf() {
  const date = document.getElementById('pdf-date').value;
  if (!date) { SaathiUI.toast('Pick a date first.', 'danger'); return; }
  window.open(`/api/brief-pdf?date=${date}`, '_blank');
}

function confirmTime() {
  const h = document.getElementById('sch-hour').value;
  const m = document.getElementById('sch-min').value || '00';
  const ampm = document.getElementById('sch-ampm').value;
  if (!h) { SaathiUI.toast('Please select an hour.', 'danger'); return; }
  let hour24 = parseInt(h, 10);
  if (ampm === 'PM' && hour24 !== 12) hour24 += 12;
  if (ampm === 'AM' && hour24 === 12) hour24 = 0;
  const hh = String(hour24).padStart(2, '0');
  document.getElementById('sch-time').value = `${hh}:${m}`;
  document.getElementById('time-confirmed').textContent = `✓ Time set: ${h}:${m} ${ampm}`;
}

function fmt12h(t) {
  if (!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr, 10);
  const m = mStr || '00';
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}

async function loadSchedule() {
  const r = await fetch('/api/schedule');
  const data = await r.json();
  allSchedule = data.schedule || [];
  renderCalendar();
  renderList();
}

function renderList() {
  const todayIST = getTodayIST();

  // Group events by date
  const byDate = {};
  allSchedule.forEach(ev => {
    if (!byDate[ev.date]) byDate[ev.date] = [];
    byDate[ev.date].push(ev);
  });

  const filterBar = document.getElementById('cal-filter-bar');
  const filterLabel = document.getElementById('cal-filter-label');
  let dates;
  if (selectedDateFilter) {
    dates = byDate[selectedDateFilter] ? [selectedDateFilter] : [];
    const label = selectedDateFilter === todayIST ? 'Today' : new Date(selectedDateFilter + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    filterLabel.textContent = `Showing events on ${label} (${selectedDateFilter})`;
    filterBar.style.display = 'flex';
  } else {
    dates = Object.keys(byDate).sort();
    filterBar.style.display = 'none';
  }

  let html = '';
  if (allSchedule.length === 0) {
    html += '<div class="section-title" style="margin-top:24px;margin-bottom:12px">Upcoming events</div>';
    html += '<p class="empty-state">No events scheduled yet.</p>';
  } else if (selectedDateFilter && dates.length === 0) {
    html += '<p class="empty-state" style="margin-top:16px">No events on this date.</p>';
  }

  dates.forEach(date => {
    const evts = byDate[date];
    const isToday = date === todayIST;
    const dateLabel = isToday ? 'Today' : new Date(date + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

    html += `<div style="margin-top:24px;margin-bottom:12px;padding:14px 16px;background:${isToday ? 'var(--accent-bg)' : '#f9fafb'};border:1px solid ${isToday ? 'var(--accent-border)' : 'var(--border)'};border-radius:var(--radius-md);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:15px;font-weight:700;color:${isToday ? 'var(--accent-hover)' : 'var(--stone-700)'}">${dateLabel} · ${evts.length} event${evts.length > 1 ? 's' : ''}</div>
        <div style="font-size:12px;color:var(--stone-500);margin-top:2px">${date}</div>
      </div>
      <a href="/brief_workflow.html?date=${date}" class="btn ${isToday ? 'btn-accent' : 'btn-primary'}">Prepare brief &rarr;</a>
    </div>`;

    evts.forEach(ev => {
      html += `
      <div class="event-card">
        <div style="flex:1">
          <div class="event-name">${ev.event_name}${ev.event_type ? ` <span class="tag tag-t2">${ev.event_type}</span>` : ''}</div>
          <div class="event-meta">${ev.time ? fmt12h(ev.time) + ' · ' : ''}${ev.mandal}</div>
          ${ev.nearby_contacts?.length ? `
            <div class="event-contacts">
              <div class="event-contacts-label">${ev.nearby_count} priority contacts nearby</div>
              ${ev.nearby_contacts.slice(0,5).map(c => `
                <div class="nearby-item">
                  <span><strong>${c.name}</strong> &middot; ${c.village} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
                  <a href="tel:${c.phone}" class="phone-link">${c.phone}</a>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
        <button onclick="deleteSchedule('${ev.id}')" class="delete-icon-btn" title="Delete event"><i data-lucide="trash-2"></i></button>
      </div>`;
    });
  });

  document.getElementById('upcoming-list').innerHTML = html;
  lucide.createIcons();
}

const CAL_WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function renderCalendar() {
  const todayIST = getTodayIST();

  const countByDate = {};
  allSchedule.forEach(ev => {
    countByDate[ev.date] = (countByDate[ev.date] || 0) + 1;
  });

  document.getElementById('cal-month-label').textContent = `${CAL_MONTHS[calViewMonth]} ${calViewYear}`;

  const weekdaysEl = document.getElementById('cal-weekdays');
  weekdaysEl.innerHTML = CAL_WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('');

  const firstDayOffset = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();

  const pad = n => String(n).padStart(2, '0');

  let cellsHtml = '';
  for (let i = 0; i < firstDayOffset; i++) {
    cellsHtml += '<div class="cal-day other-month"></div>';
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calViewYear}-${pad(calViewMonth + 1)}-${pad(day)}`;
    const count = countByDate[dateStr] || 0;
    const classes = ['cal-day'];
    if (dateStr === todayIST) classes.push('today');
    if (dateStr === selectedDateFilter) classes.push('selected');
    cellsHtml += `<div class="${classes.join(' ')}" onclick="onCalDayClick('${dateStr}', ${count > 0})">
      ${day}
      ${count > 0 ? `<span class="cal-dot">${count}</span>` : ''}
    </div>`;
  }

  document.getElementById('cal-grid').innerHTML = cellsHtml;
}

function changeMonth(delta) {
  calViewMonth += delta;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  renderCalendar();
}

function jumpToday() {
  const [ty, tm] = getTodayIST().split('-').map(Number);
  calViewYear = ty;
  calViewMonth = tm - 1;
  renderCalendar();
}

function onCalDayClick(dateStr, hasEvents) {
  if (hasEvents) {
    selectedDateFilter = selectedDateFilter === dateStr ? null : dateStr;
    renderCalendar();
    renderList();
    document.getElementById('upcoming-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    document.getElementById('sch-date').value = dateStr;
    document.getElementById('sch-name').scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('sch-name').focus();
  }
}

function clearDateFilter() {
  selectedDateFilter = null;
  renderCalendar();
  renderList();
}

async function submitSchedule() {
  const name = document.getElementById('sch-name').value;
  const date = document.getElementById('sch-date').value;
  const mandalSel = document.getElementById('sch-mandal').value;
  const mandal = mandalSel === '__other__' ? document.getElementById('sch-mandal-custom').value.trim() : mandalSel;
  const villageSel = document.getElementById('sch-village').value;
  const village = villageSel === '__other__' ? document.getElementById('sch-village-custom').value.trim() : villageSel;
  if (!name || !date || !mandal) { SaathiUI.toast('Fill required fields.', 'danger'); return; }

  const btn = document.getElementById('schedule-submit-btn');
  btn.disabled = true; btn.textContent = 'Processing...';

  try {
    const r = await fetch('/api/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: name, date, mandal,
        time: document.getElementById('sch-time').value,
        village,
        description: document.getElementById('sch-desc').value,
        event_type: document.getElementById('sch-event-type').value
      })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);

    let html = `<div class="nearby-result">
      <h4>Found ${data.nearby_count} priority contacts near ${mandal}</h4>
      <p class="hint">These contacts will be boosted in today's brief.</p>`;
    data.nearby_contacts.slice(0,5).forEach(c => {
      html += `<div class="nearby-item">
        <span><strong>${c.name}</strong> &middot; ${c.village} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
        <a href="tel:${c.phone}" class="phone-link">${c.phone}</a>
      </div>`;
    });
    html += `</div>`;
    document.getElementById('schedule-result').innerHTML = html;
    loadSchedule();
  } catch(e) {
    SaathiUI.toast(e.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="calendar-plus" style="width:16px;height:16px"></i> Save & Find Nearby Contacts';
    lucide.createIcons();
  }
}

async function deleteSchedule(id) {
  if (await SaathiUI.confirm('Delete this event? This cannot be undone.')) {
    await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
    loadSchedule();
  }
}

loadSchedule();
</script>
</body>
</html>
