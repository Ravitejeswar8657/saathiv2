<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PA Schedule · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fafaf9;color:#1a1208;min-height:100vh;padding:0}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
.back-link{display:inline-block;margin-bottom:16px;font-size:13px;color:#6b7280;text-decoration:none}
.back-link:hover{color:#1a1208}
.header{margin-bottom:24px}
.header h1{font-size:22px;font-weight:700;color:#1a1208}
.header p{font-size:14px;color:#6b7280;margin-top:4px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.section-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:10px 12px;border:1px solid #d4d4d4;border-radius:6px;
  font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:#b45309;outline:none;box-shadow:0 0 0 2px rgba(180,83,9,0.12)
}
.form-group textarea{resize:vertical;min-height:80px}
.submit-btn{
  background:#1a1208;color:#fff;border:none;border-radius:6px;padding:12px 20px;
  font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.submit-btn:hover{background:#374151}
.submit-btn:disabled{background:#9ca3af;cursor:not-allowed}
.nearby-result{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:16px;margin-top:16px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.nearby-result h4{font-size:14px;font-weight:600;color:#374151;margin-bottom:4px}
.nearby-result .hint{font-size:12px;color:#6b7280;margin-bottom:12px}
.nearby-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.nearby-item:last-child{border:none}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;margin-left:6px}
.tag-t1{background:#fef3c7;color:#92400e}
.tag-t2{background:#e0f2fe;color:#0369a1}
.tag-t3{background:#f1f5f9;color:#64748b}
.phone-link{color:#b45309;text-decoration:none;font-weight:600;font-size:13px}
.phone-link:hover{text-decoration:underline}
.event-card{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;border:1px solid #e5e5e5;border-radius:8px;margin-bottom:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.event-name{font-size:14px;font-weight:600;color:#1a1208}
.event-meta{font-size:12px;color:#6b7280;margin-top:2px}
.delete-btn{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px}
.delete-btn:hover{color:#dc2626;background:#fef2f2}
.event-contacts{margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6}
.event-contacts-label{font-size:12px;font-weight:600;color:#6b7280;margin-bottom:6px}
.empty-state{font-size:13px;color:#6b7280;padding:8px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.time-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.time-picker select{width:auto;padding:10px 8px}
.time-ok-btn{
  padding:10px 14px;background:#1a1208;color:#fff;border:none;border-radius:6px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap
}
.time-ok-btn:hover{background:#374151}
.time-confirmed{font-size:12px;color:#0f766e;font-weight:600;margin-top:5px}

.prep-toggle-btn{background:#fff;border:1px solid #d4d4d4;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:#374151;cursor:pointer;margin-top:8px}
.prep-toggle-btn:hover{background:#f9fafb}
.prep-panel{margin-top:12px;border-top:1px solid #f3f4f6;padding-top:12px}
.prep-section{border:1px solid #e5e5e5;border-radius:8px;margin-bottom:10px;overflow:hidden}
.prep-section-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fafaf9;cursor:pointer}
.prep-section-title{font-size:13px;font-weight:600;color:#1a1208}
.prep-section-body{padding:12px;display:none}
.prep-section-body.open{display:block}
.status-chip{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.status-chip.pending{background:#fef3c7;color:#92400e}
.status-chip.saved{background:#dcfce7;color:#166534}
.status-chip.skipped{background:#f1f5f9;color:#64748b}
.contact-brief-card{border:1px solid #f3f4f6;border-radius:6px;padding:10px;margin-bottom:8px}
.contact-brief-card .cb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.contact-brief-card .cb-name{font-size:13px;font-weight:600}
.contact-brief-card .cb-hint{font-size:11px;color:#9ca3af;margin-bottom:6px}
.contact-brief-card textarea{width:100%;min-height:50px;padding:8px;border:1px solid #d4d4d4;border-radius:6px;font-size:13px;font-family:inherit}
.cb-actions{display:flex;gap:8px;margin-top:6px;align-items:center;font-size:12px}
.cb-actions label{display:flex;align-items:center;gap:4px;color:#6b7280;font-weight:500}
.mini-btn{background:#1a1208;color:#fff;border:none;border-radius:5px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
.mini-btn.secondary{background:#fff;color:#374151;border:1px solid #d4d4d4}
.mini-btn:hover{opacity:.9}
.checklist-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #f9fafb}
.checklist-item:last-child{border:none}
.checklist-item input[type=checkbox]{margin-top:3px}
.custom-list{margin-top:8px}
.custom-pill{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:14px;padding:4px 10px;font-size:12px;margin:4px 6px 0 0}
.custom-pill button{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:13px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;padding:8px 10px;border:1px solid #d4d4d4;border-radius:6px;font-size:13px}
.reset-link{font-size:12px;color:#b45309;cursor:pointer;text-decoration:underline;margin-left:8px}
.speech-textarea{width:100%;min-height:140px;padding:10px;border:1px solid #d4d4d4;border-radius:6px;font-size:13px;font-family:inherit;resize:vertical}
.prompt-hint{font-size:12px;color:#6b7280;background:#fafaf9;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.news-pick-item{font-size:12px;color:#374151;line-height:1.5}
.news-pick-item a{color:#b45309;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Back to Portal</a>
  <div class="header">
    <h1>MP Schedule & Events</h1>
    <p>Schedule events and find nearby priority contacts.</p>
  </div>

  <div class="card">
    <div class="section-title">Add new event</div>
    <div class="form-row">
      <div class="form-group"><label>Event name *</label><input id="sch-name" placeholder="e.g. Public Meeting"></div>
      <div class="form-group"><label>Date *</label><input id="sch-date" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Time</label>
        <div class="time-picker">
          <select id="sch-hour">
            <option value="">Hr</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option><option>11</option><option>12</option>
          </select>
          <select id="sch-min">
            <option value="00">00</option><option value="15">15</option>
            <option value="30">30</option><option value="45">45</option>
          </select>
          <select id="sch-ampm"><option>AM</option><option>PM</option></select>
          <button type="button" class="time-ok-btn" onclick="confirmTime()">OK</button>
        </div>
        <div id="time-confirmed" class="time-confirmed"></div>
        <input type="hidden" id="sch-time" value=""/>
      </div>
      <div class="form-group"><label>Mandal *</label>
        <select id="sch-mandal">
          <option value="">Select Mandal</option>
          <option>Amaravathi</option><option>Atchampet</option><option>Bellamkonda</option><option>Krosuru</option>
          <option>Muppalla</option><option>Nekarikallu</option><option>Pedakurapadu</option><option>Rajupalem</option>
          <option>Sattenapalli</option><option>Bollapalle</option><option>Chilakaluripet</option><option>Edlapadu</option>
          <option>Ipuru</option><option>Nadendla</option><option>Narasaraopet</option><option>Nuzendla</option>
          <option>Rompicherla</option><option>Savalyapuram</option><option>Vinukonda</option><option>Dachepalle</option>
          <option>Durgi</option><option>Gurazala</option><option>Karempudi</option><option>Machavaram</option>
          <option>Macherla</option><option>Piduguralla</option><option>Rentachintala</option><option>Veldurthi</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Address / village</label><input id="sch-village" placeholder="e.g. Sattenapalli Town"></div>
      <div class="form-group"><label>Event type</label>
        <select id="sch-event-type">
          <option value="">Select type</option>
          <option>Public Meeting</option><option>Grievance Camp</option>
          <option>Inauguration</option><option>Condolence Visit</option>
          <option>Party Cadre Meeting</option><option>Festival</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Description</label><textarea id="sch-desc" placeholder="Agenda or notes..."></textarea></div>
    <button class="submit-btn" onclick="submitSchedule()">
      <i data-lucide="calendar-plus" style="width:16px;height:16px"></i> Save & Find Nearby Contacts
    </button>
  </div>

  <div id="schedule-result"></div>

  <div class="card" style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div class="form-group" style="margin-bottom:0;flex:1;min-width:160px">
      <label>Download brief PDF for</label>
      <input type="date" id="pdf-date">
    </div>
    <button class="mini-btn" style="padding:10px 16px;font-size:14px" onclick="downloadBriefPdf()">Download Final Brief PDF</button>
  </div>

  <div id="upcoming-list"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  const pdfDateInput = document.getElementById('pdf-date');
  if (pdfDateInput && !pdfDateInput.value) {
    pdfDateInput.value = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  }
});

function downloadBriefPdf() {
  const date = document.getElementById('pdf-date').value;
  if (!date) { alert('Pick a date first.'); return; }
  window.open(`/api/brief-pdf?date=${date}`, '_blank');
}

function confirmTime() {
  const h = document.getElementById('sch-hour').value;
  const m = document.getElementById('sch-min').value || '00';
  const ampm = document.getElementById('sch-ampm').value;
  if (!h) { alert('Please select an hour.'); return; }
  let hour24 = parseInt(h, 10);
  if (ampm === 'PM' && hour24 !== 12) hour24 += 12;
  if (ampm === 'AM' && hour24 === 12) hour24 = 0;
  const hh = String(hour24).padStart(2, '0');
  document.getElementById('sch-time').value = `${hh}:${m}`;
  document.getElementById('time-confirmed').textContent = `✓ Time set: ${h}:${m} ${ampm}`;
}

function fmt12h(t) {
  if (!t) return '';
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr, 10);
  const m = mStr || '00';
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}

async function loadSchedule() {
  const r = await fetch('/api/schedule');
  const data = await r.json();
  const schedule = data.schedule || [];
  let html = '<div class="section-title" style="margin-top:24px;margin-bottom:12px">Upcoming events</div>';
  if (schedule.length === 0) html += '<p class="empty-state">No events scheduled yet.</p>';
  schedule.forEach(ev => {
    html += `
    <div class="event-card">
      <div style="flex:1">
        <div class="event-name">${ev.event_name}${ev.event_type ? ` <span class="tag tag-t2">${ev.event_type}</span>` : ''}</div>
        <div class="event-meta">${ev.date}${ev.time ? ' · ' + fmt12h(ev.time) : ''} &middot; ${ev.mandal}</div>
        ${ev.nearby_contacts?.length ? `
          <div class="event-contacts">
            <div class="event-contacts-label">${ev.nearby_count} priority contacts nearby</div>
            ${ev.nearby_contacts.slice(0,5).map(c => `
              <div class="nearby-item">
                <span><strong>${c.name}</strong> &middot; ${c.village} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
                <a href="tel:${c.phone}" class="phone-link">${c.phone}</a>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <button class="prep-toggle-btn" onclick="togglePrep('${ev.id}')" id="prep-toggle-${ev.id}">Prep this event &#9656;</button>
        <div id="prep-container-${ev.id}"></div>
      </div>
      <button onclick="deleteSchedule('${ev.id}')" class="delete-btn" title="Delete event">&times;</button>
    </div>`;
  });
  document.getElementById('upcoming-list').innerHTML = html;
  lucide.createIcons();
}

// ── Event prep panel ─────────────────────────────────────────────────────
const prepDataCache = {};   // eventId -> last-fetched prep payload from the server
const prepOpenState = {};   // eventId -> boolean, whether the panel is expanded

async function togglePrep(eventId) {
  const container = document.getElementById(`prep-container-${eventId}`);
  const btn = document.getElementById(`prep-toggle-${eventId}`);
  const isOpen = prepOpenState[eventId];
  if (isOpen) {
    container.innerHTML = '';
    prepOpenState[eventId] = false;
    btn.innerHTML = 'Prep this event &#9656;';
    return;
  }
  prepOpenState[eventId] = true;
  btn.innerHTML = 'Hide prep &#9662;';
  container.innerHTML = '<p class="empty-state">Loading…</p>';
  await refreshPrep(eventId);
}

async function refreshPrep(eventId) {
  const r = await fetch(`/api/schedule/${eventId}/prep`);
  const data = await r.json();
  prepDataCache[eventId] = data;
  renderPrepPanel(eventId);
}

function sectionStatus(label, state) {
  const cls = state === 'saved' ? 'saved' : state === 'skipped' ? 'skipped' : 'pending';
  const text = state === 'saved' ? 'Saved' : state === 'skipped' ? 'Skipped' : 'Not reviewed';
  return `<span class="status-chip ${cls}">${label}: ${text}</span>`;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function renderPrepPanel(eventId) {
  const data = prepDataCache[eventId];
  if (!data) return;
  const { event, contacts, speech_draft, creative_suggestions, news_suggestions } = data;

  const briefsReviewedCount = contacts.filter(c => c.brief_reviewed).length;
  const briefsState = briefsReviewedCount === contacts.length && contacts.length > 0 ? 'saved' : briefsReviewedCount > 0 ? 'saved' : 'pending';
  const speechState = event.speech_points_reviewed ? 'saved' : 'pending';
  const creativeState = event.creative_touches?.reviewed ? 'saved' : 'pending';

  const html = `
  <div class="prep-panel">
    <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">
      ${sectionStatus(`Contacts (${briefsReviewedCount}/${contacts.length})`, briefsState)}
      ${sectionStatus('Speech', speechState)}
      ${sectionStatus('Creative', creativeState)}
    </div>

    <div class="prep-section">
      <div class="prep-section-header" onclick="togglePrepSection('${eventId}','briefs')">
        <span class="prep-section-title">1. Contact briefs</span>
        ${sectionStatus('', briefsState)}
      </div>
      <div class="prep-section-body" id="prep-body-${eventId}-briefs">
        ${contacts.length > 8 ? `<div class="cb-hint" style="margin-bottom:8px">Showing the top 8 by priority. <span class="reset-link" onclick="showAllContactBriefs('${eventId}')">Show all ${contacts.length}</span></div>` : ''}
        <div id="cb-list-${eventId}">${renderContactBriefCards(eventId, contacts.slice(0, 8))}</div>
        ${contacts.length > 8 ? `<div id="cb-list-rest-${eventId}" style="display:none">${renderContactBriefCards(eventId, contacts.slice(8))}</div>` : ''}
      </div>
    </div>

    <div class="prep-section">
      <div class="prep-section-header" onclick="togglePrepSection('${eventId}','speech')">
        <span class="prep-section-title">2. Speech points</span>
        ${sectionStatus('', speechState)}
      </div>
      <div class="prep-section-body" id="prep-body-${eventId}-speech">
        <div class="prompt-hint">Did you cover: a local name-check? a concrete promise? a thank-you to the host?</div>
        <textarea class="speech-textarea" id="speech-text-${eventId}">${escapeHtml(event.speech_points || speech_draft)}</textarea>
        <div style="margin-top:8px">
          <button class="mini-btn" onclick="saveSpeechPoints('${eventId}',true)">&#10003; Looks good</button>
          <button class="mini-btn secondary" onclick="saveSpeechPoints('${eventId}',false)">Save draft</button>
          <span class="reset-link" onclick="resetSpeechDraft('${eventId}')">&#8635; Reset to suggested draft</span>
        </div>
      </div>
    </div>

    <div class="prep-section">
      <div class="prep-section-header" onclick="togglePrepSection('${eventId}','creative')">
        <span class="prep-section-title">3. Creative touches</span>
        ${sectionStatus('', creativeState)}
      </div>
      <div class="prep-section-body" id="prep-body-${eventId}-creative">
        ${creative_suggestions.map(s => `
          <div class="checklist-item">
            <input type="checkbox" id="ct-${eventId}-${s.id}" ${(event.creative_touches?.selected||[]).includes(s.id) ? 'checked' : ''}>
            <label for="ct-${eventId}-${s.id}">${s.label}</label>
          </div>
        `).join('')}
        <div class="custom-list" id="ct-custom-list-${eventId}">
          ${(event.creative_touches?.custom||[]).map((t,i) => `<span class="custom-pill">${t} <button onclick="removeCustomTouch('${eventId}',${i})">&times;</button></span>`).join('')}
        </div>
        <div class="add-row">
          <input type="text" id="ct-custom-input-${eventId}" placeholder="Add your own idea...">
          <button class="mini-btn secondary" onclick="addCustomTouch('${eventId}')">Add</button>
        </div>
        <div style="margin-top:8px">
          <button class="mini-btn" onclick="saveCreativeTouches('${eventId}',true)">&#10003; Looks good</button>
          <button class="mini-btn secondary" onclick="saveCreativeTouches('${eventId}',false)">Save draft</button>
        </div>
      </div>
    </div>

    <div class="prep-section">
      <div class="prep-section-header" onclick="togglePrepSection('${eventId}','news')">
        <span class="prep-section-title">4. News for this brief</span>
      </div>
      <div class="prep-section-body" id="prep-body-${eventId}-news">
        ${news_suggestions.length === 0 ? '<p class="empty-state">No live news found right now.</p>' : news_suggestions.map((n,i) => `
          <div class="checklist-item news-pick-item">
            <input type="checkbox" id="news-${eventId}-${i}" ${(event.news_selected||[]).some(s=>s.link===n.link) ? 'checked' : ''}>
            <label for="news-${eventId}-${i}"><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a> ${n.mandal_tag ? `· ${n.mandal_tag}` : ''}</label>
          </div>
        `).join('')}
        <div style="margin-top:8px">
          <button class="mini-btn secondary" onclick="saveNewsSelection('${eventId}')">Save selection</button>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById(`prep-container-${eventId}`).innerHTML = html;
  // All sections start collapsed — with up to 20 contacts, auto-expanding briefs by default
  // buries the other three steps. The PA picks what to open.
}

function renderContactBriefCards(eventId, list) {
  return list.map(c => `
    <div class="contact-brief-card">
      <div class="cb-head">
        <span class="cb-name">${c.name} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
        <span style="font-size:11px;color:#9ca3af">${c.role || ''}</span>
      </div>
      ${c.ai_reason ? `<div class="cb-hint">Suggested: ${c.ai_reason}</div>` : ''}
      <textarea id="cb-text-${eventId}-${c.id}" placeholder="What should the MP know about ${c.name} for this event?">${escapeHtml(c.event_brief || c.suggested_brief)}</textarea>
      <div class="cb-actions">
        <button class="mini-btn" onclick="saveContactBrief('${eventId}','${c.id}',true)">&#10003; Looks good</button>
        <button class="mini-btn secondary" onclick="saveContactBrief('${eventId}','${c.id}',false)">Save draft</button>
        <label><input type="checkbox" id="cb-save-contact-${eventId}-${c.id}"> Save to contact too</label>
      </div>
    </div>
  `).join('');
}

function showAllContactBriefs(eventId) {
  const rest = document.getElementById(`cb-list-rest-${eventId}`);
  if (rest) rest.style.display = 'block';
}

function togglePrepSection(eventId, section) {
  const body = document.getElementById(`prep-body-${eventId}-${section}`);
  if (body) body.classList.toggle('open');
}

async function saveContactBrief(eventId, contactId, markReviewed) {
  const text = document.getElementById(`cb-text-${eventId}-${contactId}`).value;
  const saveToContact = document.getElementById(`cb-save-contact-${eventId}-${contactId}`).checked;
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contact_briefs: { [contactId]: { event_brief: text, brief_reviewed: markReviewed, save_to_contact: saveToContact } }
    })
  });
  await refreshPrep(eventId);
}

async function saveSpeechPoints(eventId, markReviewed) {
  const text = document.getElementById(`speech-text-${eventId}`).value;
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ speech_points: text, speech_points_reviewed: markReviewed })
  });
  await refreshPrep(eventId);
}

function resetSpeechDraft(eventId) {
  const data = prepDataCache[eventId];
  if (!data) return;
  document.getElementById(`speech-text-${eventId}`).value = data.speech_draft;
}

async function saveCreativeTouches(eventId, markReviewed) {
  const data = prepDataCache[eventId];
  const selected = data.creative_suggestions
    .map(s => s.id)
    .filter(id => document.getElementById(`ct-${eventId}-${id}`)?.checked);
  const custom = data.event.creative_touches?.custom || [];
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ creative_touches: { selected, custom, reviewed: markReviewed } })
  });
  await refreshPrep(eventId);
}

function addCustomTouch(eventId) {
  const input = document.getElementById(`ct-custom-input-${eventId}`);
  const text = input.value.trim();
  if (!text) return;
  const data = prepDataCache[eventId];
  data.event.creative_touches = data.event.creative_touches || { selected: [], custom: [], reviewed: false };
  data.event.creative_touches.custom = [...(data.event.creative_touches.custom||[]), text];
  input.value = '';
  renderPrepPanel(eventId);
}

function removeCustomTouch(eventId, idx) {
  const data = prepDataCache[eventId];
  data.event.creative_touches.custom.splice(idx, 1);
  renderPrepPanel(eventId);
}

async function saveNewsSelection(eventId) {
  const data = prepDataCache[eventId];
  const selected = data.news_suggestions.filter((n,i) => document.getElementById(`news-${eventId}-${i}`)?.checked);
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ news_selected: selected })
  });
  await refreshPrep(eventId);
}

async function submitSchedule() {
  const name = document.getElementById('sch-name').value;
  const date = document.getElementById('sch-date').value;
  const mandal = document.getElementById('sch-mandal').value;
  if (!name || !date || !mandal) { alert('Fill required fields.'); return; }

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = 'Processing...';

  try {
    const r = await fetch('/api/schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: name, date, mandal,
        time: document.getElementById('sch-time').value,
        village: document.getElementById('sch-village').value,
        description: document.getElementById('sch-desc').value,
        event_type: document.getElementById('sch-event-type').value
      })
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);

    let html = `<div class="nearby-result">
      <h4>Found ${data.nearby_count} priority contacts near ${mandal}</h4>
      <p class="hint">These contacts will be boosted in today's brief.</p>`;
    data.nearby_contacts.slice(0,5).forEach(c => {
      html += `<div class="nearby-item">
        <span><strong>${c.name}</strong> &middot; ${c.village} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
        <a href="tel:${c.phone}" class="phone-link">${c.phone}</a>
      </div>`;
    });
    html += `</div>`;
    document.getElementById('schedule-result').innerHTML = html;
    loadSchedule();
  } catch(e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="calendar-plus" style="width:16px;height:16px"></i> Save & Find Nearby Contacts';
    lucide.createIcons();
  }
}

async function deleteSchedule(id) {
  if (confirm('Delete this event?')) {
    await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
    loadSchedule();
  }
}

loadSchedule();
</script>
</body>
</html>
