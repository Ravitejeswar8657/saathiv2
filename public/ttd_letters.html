<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TTD Reference Letters · Saathi Palnadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest" defer></script>
<script src="/sidebar.js" defer></script>
<script src="/js/saathi-ui.js" defer></script>
<style>
.container { padding: 24px 32px; }

/* Filter + export row */
.filter-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.filter-row .form-group{margin-bottom:0;min-width:150px}

/* Table specifics */
.ttd-table th{white-space:nowrap}
.actions-cell{display:flex;gap:6px;white-space:nowrap}
.edit-row td{background:var(--bg)}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:center}
.edit-actions{display:flex;gap:8px}
.warning-banner{background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent-hover);padding:8px 12px;border-radius:var(--radius-sm);font-size:12px;margin:8px 0;display:flex;align-items:center;gap:6px}
.warning-banner [data-lucide]{width:14px;height:14px;flex-shrink:0}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title">TTD Reference Letters</h1></div>
    <div class="page-header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i data-lucide="plus"></i> Add Letter
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Calendar</div>
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&lsaquo;</button>
      <div>
        <span id="cal-month-label" class="cal-month-label"></span>
        <button class="cal-today-btn" onclick="jumpToday()">Today</button>
      </div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:4px"></div>
  </div>

  <div class="card">
    <div class="section-title">Filter &amp; export</div>
    <div class="filter-row">
      <div class="form-group">
        <label>From</label>
        <input type="date" id="range-from" onchange="onRangeChange()">
      </div>
      <div class="form-group">
        <label>To</label>
        <input type="date" id="range-to" onchange="onRangeChange()">
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="type-filter" onchange="onTypeFilterChange()">
          <option value="">All</option>
          <option value="Break Darshan">Break Darshan</option>
          <option value="Supadam">Supadam</option>
        </select>
      </div>
      <div class="form-group">
        <label>Review</label>
        <select id="review-filter" onchange="onReviewFilterChange()">
          <option value="">All</option>
          <option value="Pending Review">Pending Review</option>
          <option value="Confirmed">Confirmed</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="clearRange()">Clear range</button>
      <button class="btn btn-accent" onclick="downloadExcel()"><i data-lucide="file-spreadsheet"></i> Excel</button>
      <button class="btn btn-accent" onclick="downloadRegisterPdf()"><i data-lucide="file-text"></i> PDF list</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title" id="list-title">All letters</div>
    <div class="cal-filter-bar" id="cal-filter-bar" style="display:none">
      <span id="cal-filter-label"></span>
      <button class="cal-clear-btn" onclick="clearDateFilter()">Show all</button>
    </div>
    <div class="table-wrap">
      <table class="ttd-table">
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Phone</th><th>Aadhar</th><th>Reference</th>
            <th>Darshan Type</th><th>Party Size</th><th>Referred By</th><th>Remarks</th><th>Status</th><th>Review</th><th></th>
          </tr>
        </thead>
        <tbody id="letters-tbody"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state" style="display:none">No letters found.</div>
  </div>
</div>

<!-- ADD LETTER MODAL -->
<div id="add-modal" class="modal-overlay" onclick="closeModals()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Add TTD Reference Letter</h3>
    <div id="add-dup-warning" class="warning-banner" style="display:none"></div>
    <div class="form-group">
      <label>Date *</label>
      <input type="date" id="add-date">
    </div>
    <div class="form-group">
      <label>Darshan Type *</label>
      <select id="add-darshan-type">
        <option value="">Select type…</option>
        <option value="Break Darshan">Break Darshan</option>
        <option value="Supadam">Supadam</option>
      </select>
    </div>
    <div class="form-group">
      <label>Name *</label>
      <input id="add-name" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>Number of people</label>
      <input type="number" min="1" id="add-party-size" placeholder="e.g. 4 (Break Darshan max 6, Supadam max 10)">
    </div>
    <div class="form-group">
      <label>Phone number</label>
      <input id="add-phone" placeholder="10-digit mobile">
    </div>
    <div class="form-group">
      <label>Aadhar number</label>
      <input id="add-aadhar" placeholder="12-digit Aadhar" onblur="checkAadharDuplicate('add')">
    </div>
    <div class="form-group">
      <label>Referred by</label>
      <input id="add-referred-by" placeholder="Who referred this person">
    </div>
    <div class="form-group">
      <label>Remarks</label>
      <textarea id="add-remarks" placeholder="Any additional notes..." rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitAdd()">Save Letter</button>
      <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });

let allLetters = [];
let selectedDateFilter = null;
let selectedTypeFilter = '';
let selectedReviewFilter = '';
let rangeFrom = '';
let rangeTo = '';

function getTodayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

const [__ty, __tm] = getTodayIST().split('-').map(Number);
let calViewYear = __ty;
let calViewMonth = __tm - 1;

const CAL_WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLetters() {
  const params = new URLSearchParams();
  if (rangeFrom) params.set('from', rangeFrom);
  if (rangeTo) params.set('to', rangeTo);
  const r = await fetch('/api/ttd-letters' + (params.toString() ? '?' + params.toString() : ''));
  const data = await r.json();
  allLetters = data.letters || [];
  renderCalendar();
  renderTable();
}

function renderCalendar() {
  const todayIST = getTodayIST();
  // Count every letter on the date, including ones still pending review, so the
  // dot always reflects everything on file for that day.
  const countByDate = {};
  allLetters.forEach(l => { countByDate[l.date] = (countByDate[l.date] || 0) + 1; });

  document.getElementById('cal-month-label').textContent = `${CAL_MONTHS[calViewMonth]} ${calViewYear}`;
  document.getElementById('cal-weekdays').innerHTML = CAL_WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('');

  const firstDayOffset = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const pad = n => String(n).padStart(2, '0');

  let cellsHtml = '';
  for (let i = 0; i < firstDayOffset; i++) cellsHtml += '<div class="cal-day other-month"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calViewYear}-${pad(calViewMonth + 1)}-${pad(day)}`;
    const count = countByDate[dateStr] || 0;
    const classes = ['cal-day'];
    if (dateStr === todayIST) classes.push('today');
    if (dateStr === selectedDateFilter) classes.push('selected');
    cellsHtml += `<div class="${classes.join(' ')}" onclick="onCalDayClick('${dateStr}', ${count > 0})">
      ${day}
      ${count > 0 ? `<span class="cal-dot">${count}</span>` : ''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cellsHtml;
}

function changeMonth(delta) {
  calViewMonth += delta;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  renderCalendar();
}
function jumpToday() {
  const [ty, tm] = getTodayIST().split('-').map(Number);
  calViewYear = ty; calViewMonth = tm - 1;
  renderCalendar();
}
function onCalDayClick(dateStr, hasLetters) {
  if (!hasLetters) return;
  selectedDateFilter = selectedDateFilter === dateStr ? null : dateStr;
  renderCalendar();
  renderTable();
}
function clearDateFilter() {
  selectedDateFilter = null;
  renderCalendar();
  renderTable();
}

function onRangeChange() {
  rangeFrom = document.getElementById('range-from').value;
  rangeTo = document.getElementById('range-to').value;
  loadLetters();
}
function clearRange() {
  document.getElementById('range-from').value = '';
  document.getElementById('range-to').value = '';
  rangeFrom = ''; rangeTo = '';
  loadLetters();
}

function onTypeFilterChange() {
  selectedTypeFilter = document.getElementById('type-filter').value;
  renderTable();
}
function onReviewFilterChange() {
  selectedReviewFilter = document.getElementById('review-filter').value;
  renderTable();
}

function statusOf(dateStr) {
  return dateStr < getTodayIST() ? 'Given' : 'Upcoming';
}
function maskAadhar(a) {
  if (!a) return '';
  const s = String(a);
  return s.length > 4 ? '••••••••' + s.slice(-4) : s;
}

function renderTable() {
  const filterBar = document.getElementById('cal-filter-bar');
  const filterLabel = document.getElementById('cal-filter-label');
  const titleEl = document.getElementById('list-title');

  let list = allLetters;
  if (selectedTypeFilter) {
    list = list.filter(l => l.darshan_type === selectedTypeFilter);
  }
  if (selectedReviewFilter) {
    list = list.filter(l => (l.review_status || 'Confirmed') === selectedReviewFilter);
  }
  if (selectedDateFilter) {
    list = list.filter(l => l.date === selectedDateFilter);
    const label = selectedDateFilter === getTodayIST() ? 'Today' : new Date(selectedDateFilter + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    filterLabel.textContent = `Showing letters on ${label}`;
    filterBar.style.display = 'flex';
    titleEl.textContent = `Letters on ${label}`;
  } else {
    filterBar.style.display = 'none';
    titleEl.textContent = 'All letters';
  }

  const tbody = document.getElementById('letters-tbody');
  const emptyState = document.getElementById('empty-state');
  if (list.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  tbody.innerHTML = list.map(l => `
    <tr id="row-${l.id}">
      <td>${esc(l.date)}</td>
      <td>${esc(l.name)}</td>
      <td>${esc(l.phone)}</td>
      <td>${esc(maskAadhar(l.aadhar))}</td>
      <td>${esc(l.reference)}</td>
      <td>${esc(l.darshan_type)}</td>
      <td>${esc(l.party_size ?? '')}</td>
      <td>${esc(l.referred_by)}</td>
      <td>${esc(l.remarks)}</td>
      <td><span class="badge badge-${statusOf(l.date) === 'Given' ? 'neutral' : 'accent'}">${statusOf(l.date)}</span></td>
      <td><span class="badge badge-${(l.review_status || 'Confirmed') === 'Confirmed' ? 'success' : 'info'}">${esc(l.review_status || 'Confirmed')}</span></td>
      <td class="actions-cell">
        ${l.review_status === 'Pending Review' ? `<button class="btn btn-sm btn-success" onclick="confirmLetter('${l.id}')" title="Confirm"><i data-lucide="check-circle"></i></button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="startEdit('${l.id}')" title="Edit"><i data-lucide="pencil"></i></button>
        <button class="btn btn-sm btn-danger" onclick="deleteLetter('${l.id}')" title="Delete"><i data-lucide="trash-2"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="window.open('/api/ttd-letters/${l.id}/letter-pdf','_blank')" title="Download letter"><i data-lucide="file-down"></i></button>
      </td>
    </tr>
    <tr id="edit-${l.id}" class="edit-row" style="display:none">
      <td colspan="12">
        <div class="edit-grid">
          <input type="date" id="e-date-${l.id}" value="${esc(l.date)}">
          <select id="e-darshan-${l.id}">
            <option value="Break Darshan" ${l.darshan_type === 'Break Darshan' ? 'selected' : ''}>Break Darshan</option>
            <option value="Supadam" ${l.darshan_type === 'Supadam' ? 'selected' : ''}>Supadam</option>
          </select>
          <input id="e-name-${l.id}" value="${esc(l.name)}" placeholder="Name">
          <input type="number" min="1" id="e-party-${l.id}" value="${esc(l.party_size ?? '')}" placeholder="Number of people">
          <input id="e-phone-${l.id}" value="${esc(l.phone)}" placeholder="Phone">
          <input id="e-aadhar-${l.id}" value="${esc(l.aadhar)}" placeholder="Aadhar" onblur="checkAadharDuplicate('edit', '${l.id}')">
          <input id="e-referred-${l.id}" value="${esc(l.referred_by)}" placeholder="Referred by">
          <input id="e-remarks-${l.id}" value="${esc(l.remarks)}" placeholder="Remarks">
          <div class="edit-actions">
            <button class="btn btn-sm btn-success" onclick="saveEdit('${l.id}')"><i data-lucide="check"></i> Save</button>
            <button class="btn btn-sm btn-ghost" onclick="cancelEdit('${l.id}')">Cancel</button>
          </div>
        </div>
        <div id="e-dup-${l.id}" class="warning-banner" style="display:none"></div>
      </td>
    </tr>
  `).join('');
  if (window.lucide) lucide.createIcons();
}

function startEdit(id) {
  document.getElementById('row-' + id).style.display = 'none';
  document.getElementById('edit-' + id).style.display = 'table-row';
}
function cancelEdit(id) {
  document.getElementById('row-' + id).style.display = '';
  document.getElementById('edit-' + id).style.display = 'none';
}

async function saveEdit(id) {
  const date = document.getElementById(`e-date-${id}`).value;
  const darshan_type = document.getElementById(`e-darshan-${id}`).value;
  const name = document.getElementById(`e-name-${id}`).value.trim();
  const partySizeRaw = document.getElementById(`e-party-${id}`).value.trim();
  const party_size = partySizeRaw ? Number(partySizeRaw) : null;
  const phone = document.getElementById(`e-phone-${id}`).value.trim();
  const aadhar = document.getElementById(`e-aadhar-${id}`).value.trim();
  const referred_by = document.getElementById(`e-referred-${id}`).value.trim();
  const remarks = document.getElementById(`e-remarks-${id}`).value.trim();
  if (!date || !name || !darshan_type) { SaathiUI.toast('Date, name, and darshan type are required.', 'danger'); return; }

  const r = await fetch('/api/ttd-letters/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date, name, phone, aadhar, referred_by, remarks, darshan_type, party_size }),
  });
  const data = await r.json();
  if (!r.ok) { SaathiUI.toast(data.error || 'Failed to save.', 'danger'); return; }
  SaathiUI.toast('Letter updated.', 'success');
  await loadLetters();
}

async function confirmLetter(id) {
  const r = await fetch('/api/ttd-letters/' + id, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ review_status: 'Confirmed' }),
  });
  const data = await r.json();
  if (!r.ok) { SaathiUI.toast(data.error || 'Failed to confirm.', 'danger'); return; }
  SaathiUI.toast('Letter confirmed.', 'success');
  await loadLetters();
}

async function deleteLetter(id) {
  if (!(await SaathiUI.confirm('Delete this TTD letter record? This cannot be undone.'))) return;
  await fetch('/api/ttd-letters/' + id, { method: 'DELETE' });
  SaathiUI.toast('Letter deleted.', 'success');
  await loadLetters();
}

async function checkAadharDuplicate(mode, id) {
  const aadharEl = mode === 'add' ? document.getElementById('add-aadhar') : document.getElementById(`e-aadhar-${id}`);
  const bannerEl = mode === 'add' ? document.getElementById('add-dup-warning') : document.getElementById(`e-dup-${id}`);
  const aadhar = aadharEl.value.trim();
  if (!aadhar) { bannerEl.style.display = 'none'; return; }
  const r = await fetch('/api/ttd-letters/check-duplicate?aadhar=' + encodeURIComponent(aadhar));
  const data = await r.json();
  const matches = (data.matches || []).filter(m => m.id !== id);
  if (matches.length) {
    bannerEl.innerHTML = `<i data-lucide="triangle-alert"></i> This Aadhar already has ${matches.length} letter(s) on file — most recent: ${esc(matches[0].date)} (${esc(matches[0].darshan_type)}, Ref ${esc(matches[0].reference)}). You can still save.`;
    bannerEl.style.display = 'flex';
    if (window.lucide) lucide.createIcons();
  } else {
    bannerEl.style.display = 'none';
  }
}

function openAddModal() {
  document.getElementById('add-date').value = selectedDateFilter || getTodayIST();
  document.getElementById('add-darshan-type').value = '';
  document.getElementById('add-name').value = '';
  document.getElementById('add-party-size').value = '';
  document.getElementById('add-phone').value = '';
  document.getElementById('add-aadhar').value = '';
  document.getElementById('add-referred-by').value = '';
  document.getElementById('add-remarks').value = '';
  document.getElementById('add-dup-warning').style.display = 'none';
  document.getElementById('add-modal').style.display = 'flex';
}
function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
}

async function submitAdd() {
  const date = document.getElementById('add-date').value;
  const darshan_type = document.getElementById('add-darshan-type').value;
  const name = document.getElementById('add-name').value.trim();
  const partySizeRaw = document.getElementById('add-party-size').value.trim();
  const party_size = partySizeRaw ? Number(partySizeRaw) : null;
  const phone = document.getElementById('add-phone').value.trim();
  const aadhar = document.getElementById('add-aadhar').value.trim();
  const referred_by = document.getElementById('add-referred-by').value.trim();
  const remarks = document.getElementById('add-remarks').value.trim();
  if (!date || !name || !darshan_type) { SaathiUI.toast('Date, name, and darshan type are required.', 'danger'); return; }

  const r = await fetch('/api/ttd-letters', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date, name, phone, aadhar, referred_by, remarks, darshan_type, party_size }),
  });
  const data = await r.json();
  if (!r.ok) { SaathiUI.toast(data.error || 'Failed to save.', 'danger'); return; }
  closeModals();
  SaathiUI.toast('Letter saved.', 'success');
  await loadLetters();
}

function downloadExcel() {
  const params = new URLSearchParams();
  if (rangeFrom) params.set('from', rangeFrom);
  if (rangeTo) params.set('to', rangeTo);
  window.open('/api/ttd-letters/export.xlsx' + (params.toString() ? '?' + params.toString() : ''), '_blank');
}
function downloadRegisterPdf() {
  const params = new URLSearchParams();
  if (rangeFrom) params.set('from', rangeFrom);
  if (rangeTo) params.set('to', rangeTo);
  window.open('/api/ttd-letters/export-pdf' + (params.toString() ? '?' + params.toString() : ''), '_blank');
}

loadLetters();
</script>
</body>
</html>
