<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact Directory · Saathi Palnadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/sidebar.js" defer></script>
<script src="/js/saathi-ui.js" defer></script>
<style>
/* This page pairs the title with an inline result count, so it needs a
   slightly different alignment/spacing than the shared letterhead default —
   the border/serif-title treatment itself still comes from saathi.css. */
.page-header { align-items: baseline; margin-bottom: 18px; }
.results-info { font-size: 13px; color: var(--stone-500); }
.results-info b { color: var(--ink); }

/* ── Filter bar (a .card with tighter padding) ── */
.filter-bar { padding: 14px 16px; margin-bottom: 18px; }
.search-row { position: relative; margin-bottom: 10px; }
.search-row [data-lucide] {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--stone-500); pointer-events: none;
}
#q { width: 100%; padding-left: 36px; }

.filter-row {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.filter-select {
  font-size: 13px; cursor: pointer; min-width: 0; flex: 1 1 150px; max-width: 220px;
}

.tier-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.tier-chips .chip { padding: 5px 12px; font-size: 12px; }
.chip.active-t1 { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
.chip.active-t2 { background: var(--info-bg); color: var(--info); border-color: var(--info-border); }
.chip.active-t3 { background: var(--neutral-bg); color: var(--neutral); border-color: var(--neutral-border); }
/* Party affiliation is categorical, not workflow status — its hues are
   intentionally distinct from the info/neutral tokens above. */
.chip.active-tdp { background: var(--success-bg); color: var(--success); border-color: #5eead4; }
.chip.active-jana { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
.chip.active-bjp { background: #fff7ed; color: #c2410c; border-color: #fdba74; }

.btn-clear {
  padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
  border: 1px solid var(--border); background: #fff; color: var(--stone-500);
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
  font-family: inherit;
}
.btn-clear:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
.btn-clear [data-lucide] { width: 12px; height: 12px; }

/* ── Contact grid ── */
.contacts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 12px;
}

/* Deliberately flatter than .card (no top stripe) — a dense grid tile, not a
   secondary/nested content block, so it doesn't need the letterhead accent. */
.contact-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px 16px; cursor: pointer;
  transition: border-color 0.12s, box-shadow 0.12s; box-shadow: var(--shadow-sm);
}
.contact-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(180,83,9,0.08); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.contact-name { font-weight: 700; font-size: 15px; line-height: 1.3; flex: 1; }

/* PPS is a numeric score, not a third traffic-light color system layered on
   top of the Tier badge — plain bold text plus a small proportional meter. */
.pps-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.pps-score { font-weight: 700; font-size: 12px; color: var(--ink); }
.pps-bar { width: 36px; height: 4px; border-radius: 2px; background: var(--neutral-bg); overflow: hidden; flex-shrink: 0; }
.pps-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

.card-role { font-size: 12px; color: var(--stone-500); margin-top: 2px; }

.card-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
/* Party affiliation — categorical, kept distinct from the semantic badge tokens */
.badge-jana { background: #eff6ff; color: #1d4ed8; }
.badge-bjp { background: #fff7ed; color: #c2410c; }
.badge-other { background: #f8fafc; color: #64748b; }

.card-location {
  display: flex; align-items: flex-start; gap: 5px;
  font-size: 12px; color: var(--stone-500); margin-top: 8px;
}
.card-location [data-lucide] { width: 12px; height: 12px; flex-shrink: 0; margin-top: 1px; }

.card-phone {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--accent);
  margin-top: 8px; text-decoration: none;
}
.card-phone:hover { text-decoration: underline; }
.card-phone [data-lucide] { width: 13px; height: 13px; }

.card-footer {
  display: flex; gap: 6px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.card-action-btn {
  flex: 1; padding: 5px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: #fff; color: var(--stone-500);
  cursor: pointer; text-align: center; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  transition: all 0.12s;
}
.card-action-btn:hover { background: #f5f5f4; color: var(--ink); }
.card-action-btn [data-lucide] { width: 11px; height: 11px; }
.card-action-copy:hover { background: var(--info-bg); color: var(--info); border-color: var(--info-border); }

/* ── Load more ── */
.load-more-wrap { text-align: center; margin-top: 20px; }
.btn-load-more {
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: #fff; color: var(--ink);
  cursor: pointer; font-family: inherit; transition: background 0.12s;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn-load-more:hover { background: #f5f5f4; }
.btn-load-more [data-lucide] { width: 14px; height: 14px; }

/* ── Empty / loading ── */
.state-msg { text-align: center; color: var(--stone-500); font-size: 14px; padding: 48px 24px; }
.state-msg [data-lucide] { width: 36px; height: 36px; margin-bottom: 12px; opacity: 0.3; display: block; margin-left: auto; margin-right: auto; }

/* ── Detail Modal ── */
.modal { max-width: 520px; }
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.modal-close {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: none; background: var(--neutral-bg); cursor: pointer; flex-shrink: 0;
}
.modal-close:hover { background: var(--neutral-border); }
.modal-close [data-lucide] { width: 15px; height: 15px; }

.detail-section { margin-bottom: 18px; }
.detail-section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--stone-500); margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; }
.detail-label { color: var(--stone-500); width: 120px; flex-shrink: 0; font-weight: 500; }
.detail-value { color: var(--ink); font-weight: 400; flex: 1; }
.detail-phone { color: var(--accent); font-weight: 700; text-decoration: none; }
.detail-phone:hover { text-decoration: underline; }

.issue-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: var(--radius-full); font-size: 12px; font-weight: 600; margin: 3px 3px 3px 0;
}
.issue-pill-pending { background: var(--accent-bg); color: var(--accent); }
.issue-pill-approved { background: var(--success-bg); color: var(--success); }
.issue-pill-rejected { background: var(--danger-bg); color: var(--danger); }
.issue-pill-none { background: var(--neutral-bg); color: var(--neutral); }

.modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.btn-modal {
  flex: 1; padding: 9px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.12s; white-space: nowrap;
}
.btn-modal [data-lucide] { width: 13px; height: 13px; }
.btn-modal-primary { background: var(--success); color: #fff; border-color: var(--success); }
.btn-modal-primary:hover { background: #115e56; }
.btn-modal-ghost { background: #fff; color: var(--stone-500); border-color: var(--border); }
.btn-modal-ghost:hover { background: #f5f5f4; color: var(--ink); }

/* ── Responsive ── */
@media (max-width: 600px) {
  .filter-row { flex-direction: column; gap: 8px; }
  .filter-select { max-width: 100%; }
  .contacts-grid { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Contact Directory</h1>
    <div class="results-info" id="results-info">Loading...</div>
  </div>

  <!-- ── Filter bar ── -->
  <div class="card filter-bar">
    <div class="search-row">
      <i data-lucide="search"></i>
      <input type="search" id="q" placeholder="Search by name, village, role..." autocomplete="off">
    </div>
    <div class="filter-row">
      <select class="filter-select" id="f-constituency" onchange="onConstituencyChange()">
        <option value="">All Constituencies</option>
      </select>
      <select class="filter-select" id="f-mandal" onchange="applyFilters()">
        <option value="">All Mandals</option>
      </select>
      <select class="filter-select" id="f-role" onchange="applyFilters()">
        <option value="">All Roles</option>
      </select>
      <div class="tier-chips">
        <button class="chip" id="chip-T1" onclick="toggleTier('T1')">T1</button>
        <button class="chip" id="chip-T2" onclick="toggleTier('T2')">T2</button>
        <button class="chip" id="chip-T3" onclick="toggleTier('T3')">T3</button>
      </div>
      <div class="tier-chips">
        <button class="chip" id="chip-TDP" onclick="toggleParty('TDP')">TDP</button>
        <button class="chip" id="chip-Janasena" onclick="toggleParty('Janasena')">Janasena</button>
        <button class="chip" id="chip-BJP" onclick="toggleParty('BJP')">BJP</button>
      </div>
      <button class="btn-clear" onclick="clearFilters()">
        <i data-lucide="x"></i> Clear
      </button>
    </div>
  </div>

  <!-- ── Results ── -->
  <div class="contacts-grid" id="contacts-grid">
    <div class="state-msg" style="grid-column:1/-1">
      <i data-lucide="loader"></i> Loading contacts...
    </div>
  </div>
  <div class="load-more-wrap" id="load-more-wrap" style="display:none">
    <button class="btn-load-more" onclick="showMore()">
      <i data-lucide="chevron-down"></i> Show more
    </button>
  </div>
</div>

<!-- ── Detail Modal ── -->
<div class="modal-overlay" id="detail-modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modal-name"></div>
      <button class="modal-close" onclick="closeModalDirect()"><i data-lucide="x"></i></button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allContacts = [];
let filteredContacts = [];
let displayedCount = 0;
const PAGE_SIZE = 60;
let filterOptions = { mandals: [], constituencies: [], parties: [], roles: [], mandalsByConstituency: {} };
let activeTier = '';
let activeParty = '';
let searchTimer = null;

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  await loadFilterOptions();
  await loadContacts();
  document.getElementById('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 280);
  });
}

async function loadFilterOptions() {
  try {
    const r = await fetch('/api/filter-options');
    filterOptions = await r.json();

    const cSel = document.getElementById('f-constituency');
    filterOptions.constituencies.forEach(c => {
      cSel.insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`);
    });

    const roleSel = document.getElementById('f-role');
    filterOptions.roles.forEach(r => {
      roleSel.insertAdjacentHTML('beforeend', `<option value="${esc(r)}">${esc(r)}</option>`);
    });

    populateMandals('');
  } catch {}
}

function populateMandals(constituency) {
  const sel = document.getElementById('f-mandal');
  const prev = sel.value;
  sel.innerHTML = '<option value="">All Mandals</option>';
  const list = constituency
    ? (filterOptions.mandalsByConstituency[constituency] || [])
    : filterOptions.mandals;
  list.forEach(m => {
    sel.insertAdjacentHTML('beforeend', `<option value="${esc(m)}">${esc(m)}</option>`);
  });
  sel.value = list.includes(prev) ? prev : '';
}

function onConstituencyChange() {
  populateMandals(document.getElementById('f-constituency').value);
  applyFilters();
}

async function loadContacts() {
  try {
    const r = await fetch('/api/contacts?limit=5000');
    const d = await r.json();
    allContacts = d.contacts || [];
    applyFilters();
  } catch {
    document.getElementById('contacts-grid').innerHTML =
      '<div class="state-msg" style="grid-column:1/-1"><i data-lucide="wifi-off"></i>Failed to load contacts.</div>';
    lucide.createIcons();
  }
}

// ── Filters ────────────────────────────────────────────────────────────────
function toggleTier(tier) {
  activeTier = activeTier === tier ? '' : tier;
  ['T1','T2','T3'].forEach(t => {
    const chip = document.getElementById(`chip-${t}`);
    chip.className = 'chip' + (activeTier === t ? ` active-t${t[1]}` : '');
  });
  applyFilters();
}

function toggleParty(party) {
  activeParty = activeParty === party ? '' : party;
  const classMap = { TDP: 'active-tdp', Janasena: 'active-jana', BJP: 'active-bjp' };
  ['TDP','Janasena','BJP'].forEach(p => {
    document.getElementById(`chip-${p}`).className = 'chip' + (activeParty === p ? ` ${classMap[p]}` : '');
  });
  applyFilters();
}

function clearFilters() {
  document.getElementById('q').value = '';
  document.getElementById('f-constituency').value = '';
  document.getElementById('f-role').value = '';
  populateMandals('');
  document.getElementById('f-mandal').value = '';
  activeTier = '';
  activeParty = '';
  ['T1','T2','T3'].forEach(t => document.getElementById(`chip-${t}`).className = 'chip');
  ['TDP','Janasena','BJP'].forEach(p => document.getElementById(`chip-${p}`).className = 'chip');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const constituency = document.getElementById('f-constituency').value;
  const mandal = document.getElementById('f-mandal').value;
  const role = document.getElementById('f-role').value;

  filteredContacts = allContacts.filter(c => {
    if (activeTier && c.tier !== activeTier) return false;
    if (activeParty && c.party !== activeParty) return false;
    if (constituency && c.constituency !== constituency) return false;
    if (mandal && c.mandal !== mandal) return false;
    if (role && c.role !== role) return false;
    if (q) {
      const hay = [c.name, c.village, c.mandal, c.constituency, c.role, c.phone, c.remarks]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  displayedCount = 0;
  renderContacts();
  updateResultsInfo();
}

function updateResultsInfo() {
  const total = allContacts.length;
  const shown = Math.min(displayedCount, filteredContacts.length);
  const filtered = filteredContacts.length;
  const el = document.getElementById('results-info');
  if (filtered === total) {
    el.innerHTML = `Showing <b>${shown}</b> of <b>${total}</b> contacts`;
  } else {
    el.innerHTML = `<b>${filtered}</b> match · showing <b>${shown}</b> of <b>${total}</b> total`;
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderContacts() {
  const grid = document.getElementById('contacts-grid');
  const batch = filteredContacts.slice(displayedCount, displayedCount + PAGE_SIZE);

  if (displayedCount === 0) {
    if (filteredContacts.length === 0) {
      grid.innerHTML = '<div class="state-msg" style="grid-column:1/-1"><i data-lucide="search-x"></i>No contacts match these filters.</div>';
      lucide.createIcons();
      document.getElementById('load-more-wrap').style.display = 'none';
      return;
    }
    grid.innerHTML = '';
  }

  batch.forEach(c => {
    grid.insertAdjacentHTML('beforeend', buildCard(c));
  });
  displayedCount += batch.length;

  const hasMore = displayedCount < filteredContacts.length;
  document.getElementById('load-more-wrap').style.display = hasMore ? 'block' : 'none';
  if (hasMore) {
    document.getElementById('load-more-wrap').innerHTML =
      `<button class="btn-load-more" onclick="showMore()"><i data-lucide="chevron-down"></i> Show more <span style="color:var(--stone-500);font-weight:400">(${filteredContacts.length - displayedCount} remaining)</span></button>`;
  }

  lucide.createIcons();
  updateResultsInfo();
}

function showMore() {
  renderContacts();
}

function ppsHTML(pps) {
  return `<div class="pps-wrap" title="Priority &amp; Proximity Score"><span class="pps-score">${pps}</span><span class="pps-bar"><span class="pps-bar-fill" style="width:${Math.min(100, pps)}%"></span></span></div>`;
}

function buildCard(c) {
  const tierClass = { T1: 'badge-accent', T2: 'badge-info', T3: 'badge-neutral' }[c.tier] || 'badge-neutral';
  const partyClass = { TDP: 'badge-success', Janasena: 'badge-jana', BJP: 'badge-bjp' }[c.party] || 'badge-other';
  const pps = c.pps_score || 0;
  const location = [c.village, c.mandal, c.constituency].filter(Boolean).join(', ');
  const hasIssues = (c.issues || []).some(i => i.status === 'pending');
  const phone = c.phone ? String(c.phone).trim() : '';

  return `
  <div class="contact-card" onclick="openModal('${esc(c.id)}')">
    <div class="card-top">
      <div class="contact-name">${esc(c.name || '—')}</div>
      ${ppsHTML(pps)}
    </div>
    <div class="card-role">${esc(c.role || '')}${c.area_of_influence ? ` · ${esc(c.area_of_influence)}` : ''}</div>
    <div class="card-badges">
      <span class="badge ${tierClass}">${c.tier || '—'}</span>
      <span class="badge ${partyClass}">${esc(c.party || 'Other')}</span>
      ${hasIssues ? '<span class="badge badge-danger">Pending Issue</span>' : ''}
      ${c.krishna_follower ? '<span class="badge badge-success">Krishna Follower</span>' : ''}
    </div>
    ${location ? `<div class="card-location"><i data-lucide="map-pin"></i><span>${esc(location)}</span></div>` : ''}
    ${phone ? `<a class="card-phone" href="tel:${esc(phone)}" onclick="event.stopPropagation()"><i data-lucide="phone"></i>${esc(phone)}</a>` : ''}
    <div class="card-footer">
      <button class="card-action-btn" onclick="event.stopPropagation();openModal('${esc(c.id)}')">
        <i data-lucide="eye"></i> View
      </button>
      ${phone ? `<button class="card-action-btn card-action-copy" onclick="event.stopPropagation();copyPhone('${esc(phone)}')"><i data-lucide="copy"></i> Copy</button>` : ''}
      <button class="card-action-btn" onclick="event.stopPropagation();logInteraction('${esc(c.id)}', this)">
        <i data-lucide="check-circle"></i> Log call
      </button>
    </div>
  </div>`;
}

// ── Copy phone ─────────────────────────────────────────────────────────────
function copyPhone(phone) {
  navigator.clipboard.writeText(phone).catch(() => {});
}

// ── Log interaction ────────────────────────────────────────────────────────
async function logInteraction(id, btn) {
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader"></i> Logging...';
  lucide.createIcons();
  try {
    await fetch('/api/log-interaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_id: id, type: 'call' }),
    });
    btn.innerHTML = '<i data-lucide="check"></i> Logged';
    btn.style.color = 'var(--success)';
    btn.style.borderColor = 'var(--success)';
  } catch {
    btn.innerHTML = '<i data-lucide="x"></i> Error';
    btn.disabled = false;
  }
  lucide.createIcons();
}

// ── Detail Modal ───────────────────────────────────────────────────────────
async function openModal(id) {
  try {
    const r = await fetch(`/api/contact/${id}`);
    const c = await r.json();
    renderModal(c);
    document.getElementById('detail-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  } catch {}
}

function renderModal(c) {
  document.getElementById('modal-name').textContent = c.name || '—';

  const tierClass = { T1: 'badge-accent', T2: 'badge-info', T3: 'badge-neutral' }[c.tier] || 'badge-neutral';
  const partyClass = { TDP: 'badge-success', Janasena: 'badge-jana', BJP: 'badge-bjp' }[c.party] || 'badge-other';
  const pps = c.pps_score || 0;
  const phone = c.phone ? String(c.phone).trim() : '';

  const rows = [
    ['Phone',        phone ? `<a class="detail-phone" href="tel:${esc(phone)}">${esc(phone)}</a>` : '—'],
    ['Village',      esc(c.village || '—')],
    ['Mandal',       esc(c.mandal || '—')],
    ['Constituency', esc(c.constituency || '—')],
    ['Role',         esc(c.role || '—')],
    ['Area',         esc(c.area_of_influence || '—')],
    ['Party',        `<span class="badge ${partyClass}">${esc(c.party || 'Other')}</span>`],
    ['Tier',         `<span class="badge ${tierClass}">${c.tier || '—'}</span>`],
    ['PPS Score',    ppsHTML(pps)],
    ['Priority',     esc(c.priority_level || '—')],
    ['Affinity',     esc(c.affinity || '—')],
    ['Est. Reach',   c.estimated_reach ? `~${c.estimated_reach.toLocaleString()} people` : '—'],
    ['Krishna Follower', c.krishna_follower ? 'Yes' : 'No'],
  ].filter(([, v]) => v && v !== '—');

  let body = `
    <div class="detail-section">
      <div class="detail-section-title">Contact Info</div>
      ${rows.map(([l, v]) => `<div class="detail-row"><div class="detail-label">${l}</div><div class="detail-value">${v}</div></div>`).join('')}
    </div>`;

  if (c.remarks) {
    body += `
    <div class="detail-section">
      <div class="detail-section-title">Remarks</div>
      <div style="font-size:13px;color:var(--stone-700);line-height:1.6">${esc(c.remarks)}</div>
    </div>`;
  }

  if (c.ai_reason) {
    body += `
    <div class="detail-section">
      <div class="detail-section-title">AI Brief Reason</div>
      <div style="font-size:13px;color:var(--stone-700);line-height:1.6">${esc(c.ai_reason)}</div>
    </div>`;
  }

  const issues = c.issues || [];
  if (issues.length > 0) {
    const pillClass = { pending: 'issue-pill-pending', approved: 'issue-pill-approved', rejected: 'issue-pill-rejected', none: 'issue-pill-none' };
    body += `
    <div class="detail-section">
      <div class="detail-section-title">Issues (${issues.length})</div>
      <div>${issues.map(i => `<span class="issue-pill ${pillClass[i.status] || 'issue-pill-none'}">${esc(i.type)} · ${i.status}</span>`).join('')}</div>
    </div>`;
  }

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML = `
    ${phone ? `<a href="tel:${esc(phone)}" class="btn-modal btn-modal-primary"><i data-lucide="phone"></i> Call</a>` : ''}
    ${phone ? `<button class="btn-modal btn-modal-ghost" onclick="copyPhone('${esc(phone)}')"><i data-lucide="copy"></i> Copy number</button>` : ''}
    <a href="/pa_issues.html" class="btn-modal btn-modal-ghost"><i data-lucide="file-plus"></i> Log issue</a>
  `;
  lucide.createIcons();
}

function closeModal(e) {
  if (e.target === document.getElementById('detail-modal')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('detail-modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────
lucide.createIcons();
init();
</script>
</body>
</html>
