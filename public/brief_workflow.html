<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prepare Brief · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/js/saathi-ui.js" defer></script>
<script src="/sidebar.js" defer></script>
<style>
.back-link{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--accent);text-decoration:none}
.back-link:hover{color:var(--accent-hover)}
.card{margin-bottom:16px}
.section-title{margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-group textarea{min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.btn-block{width:100%;justify-content:center}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;margin-left:6px}
.tag-t1{background:#fef3c7;color:#92400e}
.tag-t2{background:var(--info-bg);color:var(--info)}
.tag-t3{background:var(--neutral-bg);color:var(--neutral)}
.phone-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.reset-link{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline}

.stepper{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.step-pill{flex:1;min-width:90px;text-align:center;padding:8px 6px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;background:var(--neutral-bg);color:var(--neutral);cursor:pointer;border:2px solid transparent}
.step-pill.current{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.step-pill.done{background:var(--success-bg);color:var(--success)}
.step-pill.skipped{background:var(--neutral-bg);color:var(--stone-400);text-decoration:line-through}
.wizard-nav{display:flex;justify-content:space-between;margin-top:8px}

.contact-row{border:1px solid #f3f4f6;border-radius:var(--radius-sm);padding:10px;margin-bottom:8px}
.contact-row .cr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.contact-row .cr-name{font-size:13px;font-weight:600}
.contact-row textarea{width:100%;min-height:46px;padding:8px;border:1px solid #d4d4d4;border-radius:var(--radius-sm);font-size:13px;font-family:inherit}
.cr-ref{font-size:11px;color:var(--stone-400);background:var(--bg);border-radius:5px;padding:6px 8px;margin-top:6px;display:none}
.cr-ref.open{display:block}

.checklist-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #f9fafb}
.checklist-item:last-child{border:none}
.custom-pill{display:inline-flex;align-items:center;gap:6px;background:var(--neutral-bg);border-radius:14px;padding:4px 10px;font-size:12px;margin:4px 6px 0 0}
.custom-pill button{background:none;border:none;color:var(--stone-400);cursor:pointer;display:inline-flex;align-items:center}
.custom-pill button [data-lucide]{width:12px;height:12px}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1;padding:8px 10px;border:1px solid #d4d4d4;border-radius:var(--radius-sm);font-size:13px}
.suggestion-box{background:var(--bg);border-radius:var(--radius-sm);padding:10px;margin-top:10px}

.preview-section{border-bottom:1px solid #f3f4f6;padding-bottom:14px;margin-bottom:14px}
.preview-section:last-child{border:none}
.preview-section h4{font-size:13px;font-weight:700;color:var(--success);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}
.preview-contact{font-size:13px;margin-bottom:8px}
.preview-contact .pc-name{font-weight:600}
.preview-note{color:var(--stone-700);font-size:12px;margin-top:2px}
.skip-card{background:#f9fafb;border:1px dashed #d4d4d4;border-radius:var(--radius-sm);padding:14px;text-align:center;color:var(--stone-500);font-size:13px}
.step-label{font-size:12px;font-weight:600;color:var(--stone-500);text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div class="container">
  <a href="/pa_schedule.html" class="back-link">&larr; Back to Schedule</a>
  <div class="page-header">
    <div>
      <h1 class="page-title">Prepare Daily Brief</h1>
      <p class="page-subtitle" id="event-subtitle">Loading…</p>
    </div>
  </div>

  <div class="card" style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
    <div class="form-group" style="margin-bottom:0;flex:1;min-width:180px">
      <label>MP's name (for the PDF greeting)</label>
      <input id="mp-name-input" placeholder="e.g. Krishna">
    </div>
    <button class="btn btn-secondary" onclick="saveMpName()">Save name</button>
  </div>

  <div id="no-event-form" style="display:none">
    <div class="card">
      <div class="section-title">Add new event to prepare a brief for</div>
      <div class="form-row">
        <div class="form-group"><label>Event name *</label><input id="sch-name" placeholder="e.g. Public Meeting"></div>
        <div class="form-group"><label>Date *</label><input id="sch-date" type="date"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Time</label><input id="sch-time-input" type="time"></div>
        <div class="form-group"><label>Mandal *</label>
          <select id="sch-mandal">
            <option value="">Select Mandal</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Address / village</label><input id="sch-village" placeholder="e.g. Sattenapalli Town"></div>
        <div class="form-group"><label>Event type</label>
          <select id="sch-event-type">
            <option value="">Select type</option>
            <option>Public Meeting</option><option>Grievance Camp</option>
            <option>Inauguration</option><option>Condolence Visit</option>
            <option>Party Cadre Meeting</option><option>Festival</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="sch-desc" placeholder="Agenda or notes..."></textarea></div>
      <button class="btn btn-primary btn-block" onclick="createEventAndStart()">Create event &amp; start prep</button>
    </div>
  </div>

  <div id="wizard" style="display:none">
    <div class="stepper" id="stepper-rail"></div>
    <div class="card" id="step-content"></div>
    <div class="wizard-nav">
      <button class="btn btn-secondary" id="back-btn" onclick="prevStep()">&larr; Back</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextStep()">Next &rarr;</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  document.getElementById('sch-mandal').insertAdjacentHTML('beforeend', SaathiUI.mandalOptionsHTML());
});

const STEP_DEFS = [
  { id: 'contacts', label: 'Contacts & Notes' },
  { id: 'speech', label: 'Speech' },
  { id: 'creative', label: 'Creative' },
  { id: 'news', label: 'News' },
  { id: 'preview', label: 'Preview & PDF' },
];

const params = new URLSearchParams(location.search);
let eventId = params.get('event') || '';
let dateMode = params.get('date') || '';
let prep = null;      // last-fetched GET /prep payload
let stepIndex = 0;
let speechForcedOpen = false;
let showAllContacts = false;
const newsCheckedCache = {}; // index -> bool, local UI state before save

function stepIndexOf(id) {
  return visibleSteps().findIndex(s => s.id === id);
}

function visibleSteps() {
  if (dateMode) {
    return STEP_DEFS.filter(s => {
      if (s.id !== 'speech') return true;
      return (prep.events || []).some(e => e.speech_applicable) || speechForcedOpen;
    });
  }
  return STEP_DEFS.filter(s => {
    if (s.id !== 'speech') return true;
    return prep.event.speech_applicable || speechForcedOpen;
  });
}

async function loadMpName() {
  const r = await fetch('/api/dashboard');
  const data = await r.json();
  document.getElementById('mp-name-input').value = data.metadata?.mp_name || '';
}

async function saveMpName() {
  const mp_name = document.getElementById('mp-name-input').value.trim();
  await fetch('/api/metadata', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mp_name }) });
}

async function createEventAndStart() {
  const name = document.getElementById('sch-name').value;
  const date = document.getElementById('sch-date').value;
  const mandal = document.getElementById('sch-mandal').value;
  if (!name || !date || !mandal) { SaathiUI.toast('Fill required fields.', 'danger'); return; }
  const r = await fetch('/api/schedule', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      event_name: name, date, mandal,
      time: document.getElementById('sch-time-input').value,
      village: document.getElementById('sch-village').value,
      description: document.getElementById('sch-desc').value,
      event_type: document.getElementById('sch-event-type').value,
    }),
  });
  const data = await r.json();
  if (!data.ok) { SaathiUI.toast(data.error || 'Could not create event.', 'danger'); return; }
  eventId = data.event_id;
  history.replaceState(null, '', `/brief_workflow.html?event=${eventId}`);
  document.getElementById('no-event-form').style.display = 'none';
  document.getElementById('wizard').style.display = 'block';
  await refreshPrep();
}

async function refreshPrep() {
  let r;
  if (dateMode) {
    r = await fetch(`/api/daily-prep?date=${dateMode}`);
    if (!r.ok) { document.getElementById('event-subtitle').textContent = 'No events found.'; return; }
    prep = await r.json();
    if (!prep.events.length) { document.getElementById('event-subtitle').textContent = 'No events for this date.'; return; }
    const evNames = prep.events.map(e => e.event_name).join(' + ');
    document.getElementById('event-subtitle').textContent =
      `${prep.date} · ${prep.events.length} event${prep.events.length > 1 ? 's' : ''}: ${evNames}`;
    if (!prep.event) {
      prep.event = prep.events[0];
      prep.event.news_selected = prep.news_selected || [];
    }
  } else {
    r = await fetch(`/api/schedule/${eventId}/prep`);
    if (!r.ok) { document.getElementById('event-subtitle').textContent = 'Event not found.'; return; }
    prep = await r.json();
    const ev = prep.event;
    const venue = [ev.village, ev.mandal].filter(Boolean).join(', ');
    document.getElementById('event-subtitle').textContent =
      `${ev.event_name} · ${ev.date}${ev.time ? ' ' + ev.time : ''} · ${venue}${ev.event_type ? ' · ' + ev.event_type : ''}`;
  }
  renderAll();
}

function clampStepIndex() {
  const steps = visibleSteps();
  if (stepIndex >= steps.length) stepIndex = steps.length - 1;
  if (stepIndex < 0) stepIndex = 0;
}

function renderAll() {
  clampStepIndex();
  renderStepper();
  renderStepContent();
  renderNav();
}

function renderStepper() {
  const steps = visibleSteps();
  const html = steps.map((s, i) => {
    let cls = 'step-pill';
    if (i === stepIndex) cls += ' current';
    else if (i < stepIndex) cls += ' done';
    return `<div class="${cls}" onclick="jumpToStep(${i})">${i + 1}. ${s.label}</div>`;
  }).join('');
  document.getElementById('stepper-rail').innerHTML = html;
}

function contactsApproved() {
  if (dateMode) return true;
  return prep.event.contacts_approved;
}

function jumpToStep(i) {
  if (i > stepIndex && stepIndex === 0 && !contactsApproved()) {
    SaathiUI.toast('Please review & approve the contacts first.', 'danger');
    return;
  }
  stepIndex = i;
  renderAll();
}

function renderNav() {
  const steps = visibleSteps();
  document.getElementById('back-btn').style.visibility = stepIndex === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('next-btn');
  if (stepIndex === steps.length - 1) {
    nextBtn.style.visibility = 'hidden';
  } else {
    nextBtn.style.visibility = 'visible';
    nextBtn.disabled = steps[stepIndex].id === 'contacts' && !contactsApproved();
    nextBtn.textContent = nextBtn.disabled ? 'Approve contacts to continue' : 'Next →';
  }
}

function prevStep() { stepIndex = Math.max(0, stepIndex - 1); renderAll(); }
function nextStep() {
  const steps = visibleSteps();
  if (steps[stepIndex].id === 'contacts' && !contactsApproved()) return;
  stepIndex = Math.min(steps.length - 1, stepIndex + 1);
  renderAll();
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function renderStepContent() {
  const steps = visibleSteps();
  const stepId = steps[stepIndex].id;
  const n = stepIndex + 1; // visible position — keeps the heading in sync with the stepper rail
  const el = document.getElementById('step-content');
  if (stepId === 'contacts') el.innerHTML = contactsStepHtml(n);
  else if (stepId === 'speech') el.innerHTML = speechStepHtml(n);
  else if (stepId === 'creative') el.innerHTML = creativeStepHtml(n);
  else if (stepId === 'news') el.innerHTML = newsStepHtml(n);
  else if (stepId === 'preview') el.innerHTML = previewStepHtml(n);
  lucide.createIcons();
}

// ── Step 1: Contacts & Notes ────────────────────────────────────────────────
function contactKey(c) {
  return c.event_id ? `${c.event_id}_${c.id}` : c.id;
}

function contactsStepHtml(n) {
  const contacts = prep.contacts;
  const approved = contactsApproved();

  if (dateMode && prep.events.length > 1) {
    const byEvent = {};
    contacts.forEach(c => {
      const eid = c.event_id || '_';
      if (!byEvent[eid]) byEvent[eid] = [];
      byEvent[eid].push(c);
    });

    let html = `<div class="section-title">${n}. Contacts — add notes per event</div>
      <p class="empty-state" style="margin-top:-8px">Contacts grouped by event. Add notes for each.</p>`;

    (prep.events || []).forEach(ev => {
      const evContacts = byEvent[ev.id] || [];
      const shown = showAllContacts ? evContacts : evContacts.slice(0, 8);
      html += `<div style="margin-top:16px;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--accent-hover);padding:8px 12px;background:var(--accent-bg);border-radius:var(--radius-sm);border-left:3px solid var(--accent-light)">${escapeHtml(ev.event_name)} — ${ev.mandal} (${evContacts.length} contacts)</div>`;
      html += shown.map(c => contactRowHtml(c)).join('');
      if (evContacts.length > 8 && !showAllContacts) {
        html += `<p class="empty-state">Showing top 8. <span class="reset-link" onclick="showAllContacts=true;renderStepContent()">Show all ${evContacts.length}</span></p>`;
      }
    });

    html += `<div style="margin-top:14px;padding-top:14px;border-top:1px solid #f3f4f6;text-align:right">
      <button class="btn btn-primary" onclick="approveContacts()">Save all &amp; continue</button>
    </div>`;
    return html;
  }

  const shown = showAllContacts ? contacts : contacts.slice(0, 8);
  return `
    <div class="section-title">${n}. Contacts — add a note, then approve</div>
    <p class="empty-state" style="margin-top:-8px">Just name and phone by default. Nothing here is auto-written for you.</p>
    ${contacts.length > 8 && !showAllContacts ? `<p class="empty-state">Showing top 8 by priority. <span class="reset-link" onclick="showAllContacts=true;renderStepContent()">Show all ${contacts.length}</span></p>` : ''}
    ${shown.map(c => contactRowHtml(c)).join('')}
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:${approved ? 'var(--success)' : 'var(--accent-hover)'};font-weight:600">
        ${approved ? '✓ Approved' : 'Not yet approved'}
      </span>
      <button class="btn btn-primary" onclick="approveContacts()">Review &amp; Approve contacts</button>
    </div>
  `;
}

function contactRowHtml(c) {
  const key = contactKey(c);
  return `
    <div class="contact-row">
      <div class="cr-head">
        <span class="cr-name">${c.name} <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span></span>
        <a href="tel:${c.phone}" class="phone-link">${c.phone || ''}</a>
      </div>
      <textarea id="note-${key}" placeholder="What should the MP know about ${c.name}?">${escapeHtml(c.note)}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <span class="reset-link" onclick="toggleRef('${key}')">Show comment from records</span>
        <button class="btn btn-secondary btn-sm" onclick="saveNote('${c.id}','${c.event_id || ''}')">Save note</button>
      </div>
      <div class="cr-ref" id="ref-${key}">
        ${c.reference.remarks ? `<div><b>Record:</b> ${escapeHtml(c.reference.remarks)}</div>` : ''}
        ${c.reference.ai_reason ? `<div><b>System note:</b> ${escapeHtml(c.reference.ai_reason)}</div>` : ''}
        ${!c.reference.remarks && !c.reference.ai_reason ? 'Nothing on file.' : ''}
      </div>
    </div>`;
}

function toggleRef(id) {
  document.getElementById(`ref-${id}`).classList.toggle('open');
}

async function saveNote(contactId, eventIdForContact) {
  const key = eventIdForContact ? `${eventIdForContact}_${contactId}` : contactId;
  const text = document.getElementById(`note-${key}`).value;
  if (dateMode) {
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, contacts: [{ id: contactId, event_id: eventIdForContact || undefined, note: text }] }),
    });
  } else {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_briefs: { [contactId]: { event_brief: text, brief_reviewed: !!text.trim() } } }),
    });
  }
  await refreshPrep();
}

async function saveAllVisibleNotes() {
  if (dateMode) {
    const arr = [];
    prep.contacts.forEach(c => {
      const key = contactKey(c);
      const el = document.getElementById(`note-${key}`);
      if (el) arr.push({ id: c.id, event_id: c.event_id || undefined, note: el.value });
    });
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, contacts: arr }),
    });
  } else {
    const contacts = showAllContacts ? prep.contacts : prep.contacts.slice(0, 8);
    const contact_briefs = {};
    contacts.forEach(c => {
      const el = document.getElementById(`note-${c.id}`);
      if (el) contact_briefs[c.id] = { event_brief: el.value, brief_reviewed: !!el.value.trim() };
    });
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_briefs }),
    });
  }
}

async function approveContacts() {
  await saveAllVisibleNotes();
  if (!dateMode) {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contacts_approved: true }),
    });
  }
  await refreshPrep();
}

// ── Step 2: Speech (conditional) ────────────────────────────────────────────
function speechStepHtml(n) {
  if (dateMode) {
    const events = prep.events || [];
    let html = `<div class="section-title">${n}. Speech points</div>`;
    events.forEach(ev => {
      html += `
        <div style="margin-bottom:14px">
          <div style="font-size:13px;font-weight:600;color:var(--stone-700);margin-bottom:6px">${escapeHtml(ev.event_name)} — ${ev.mandal}</div>
          <textarea id="speech-text-${ev.id}" style="min-height:100px" placeholder="Speech points for ${ev.event_name}...">${escapeHtml(ev.speech_points)}</textarea>
        </div>`;
    });
    html += `<div style="margin-top:8px"><button class="btn btn-primary" onclick="saveSpeechAll()">Save all</button></div>`;
    return html;
  }
  if (!prep.event.speech_applicable && !speechForcedOpen) {
    return `
      <div class="section-title">${n}. Speech points</div>
      <div class="skip-card">
        Skipped — ${prep.event.event_type || 'this event type'} usually doesn't need prepared speech points.
        <div style="margin-top:8px"><span class="reset-link" onclick="speechForcedOpen=true;renderAll()">Add speech points anyway</span></div>
      </div>
    `;
  }
  return `
    <div class="section-title">${n}. Speech points</div>
    <textarea id="speech-text" style="min-height:140px" placeholder="Write the speech points yourself, or insert a suggested outline below.">${escapeHtml(prep.event.speech_points)}</textarea>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveSpeech()">Save</button>
      <span class="reset-link" onclick="insertSpeechSuggestion()">Insert a suggested outline</span>
      ${prep.event.speech_applicable ? `<span class="reset-link" onclick="skipSpeech()">Skip this step</span>` : ''}
    </div>
  `;
}

async function saveSpeech() {
  const text = document.getElementById('speech-text').value;
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ speech_points: text, speech_points_reviewed: !!text.trim(), speech_skipped: false }),
  });
  await refreshPrep();
}

async function saveSpeechAll() {
  const updates = (prep.events || []).map(ev => {
    const el = document.getElementById(`speech-text-${ev.id}`);
    return { id: ev.id, speech_points: el ? el.value : '' };
  });
  await fetch('/api/daily-prep', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date: dateMode, event_updates: updates }),
  });
  await refreshPrep();
}

async function skipSpeech() {
  await fetch(`/api/schedule/${eventId}/prep`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ speech_points: '', speech_points_reviewed: false, speech_skipped: true }),
  });
  speechForcedOpen = false;
  await refreshPrep();
}

async function insertSpeechSuggestion() {
  const r = await fetch(`/api/schedule/${eventId}/suggestions?kind=speech`);
  const data = await r.json();
  const ta = document.getElementById('speech-text');
  ta.value = ta.value ? ta.value + '\n' + data.speech_draft : data.speech_draft;
}

// ── Step 3: Creative (manual + optional suggestions) ────────────────────────
function creativeStepHtml(n) {
  const custom = prep.event.creative_touches?.custom || [];
  return `
    <div class="section-title">${n}. Creative things to do</div>
    <p class="empty-state" style="margin-top:-8px">Add your own ideas. Suggestions are optional — open below if you want some.</p>
    <div class="add-row">
      <input type="text" id="creative-input" placeholder="e.g. Stop for chai at the market on the way">
      <button class="btn btn-secondary btn-sm" onclick="addCreative()">Add</button>
    </div>
    <div id="creative-list" style="margin-top:8px">
      ${custom.map((t, i) => `<span class="custom-pill">${escapeHtml(t)} <button onclick="removeCreative(${i})"><i data-lucide="x"></i></button></span>`).join('')}
    </div>
    <div style="margin-top:10px"><span class="reset-link" onclick="loadCreativeSuggestions()">Show suggestions</span></div>
    <div class="suggestion-box" id="creative-suggestion-box" style="display:none"></div>
  `;
}

function getActiveEventId() {
  return dateMode ? (prep.events[0]?.id || '') : eventId;
}

async function addCreative() {
  const input = document.getElementById('creative-input');
  const text = input.value.trim();
  if (!text) return;
  const custom = [...(prep.event.creative_touches?.custom || []), text];
  const payload = { creative_touches: { selected: prep.event.creative_touches?.selected || [], custom, reviewed: true } };
  if (dateMode) {
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, event_updates: [{ id: getActiveEventId(), ...payload }] }),
    });
  } else {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  await refreshPrep();
}

async function removeCreative(idx) {
  const custom = [...(prep.event.creative_touches?.custom || [])];
  custom.splice(idx, 1);
  const payload = { creative_touches: { selected: prep.event.creative_touches?.selected || [], custom, reviewed: true } };
  if (dateMode) {
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, event_updates: [{ id: getActiveEventId(), ...payload }] }),
    });
  } else {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  await refreshPrep();
}

async function loadCreativeSuggestions() {
  const eid = getActiveEventId();
  if (!eid) return;
  const r = await fetch(`/api/schedule/${eid}/suggestions?kind=creative`);
  const data = await r.json();
  const selected = prep.event.creative_touches?.selected || [];
  const box = document.getElementById('creative-suggestion-box');
  box.style.display = 'block';
  box.innerHTML = data.creative_suggestions.map(s => `
    <div class="checklist-item">
      <input type="checkbox" id="sugg-${s.id}" ${selected.includes(s.id) ? 'checked' : ''} onchange="toggleSuggestion('${s.id}')">
      <label for="sugg-${s.id}">${s.label}</label>
    </div>
  `).join('');
}

async function toggleSuggestion(id) {
  const checked = document.getElementById(`sugg-${id}`).checked;
  let selected = prep.event.creative_touches?.selected || [];
  selected = checked ? [...new Set([...selected, id])] : selected.filter(s => s !== id);
  const payload = { creative_touches: { selected, custom: prep.event.creative_touches?.custom || [], reviewed: true } };
  if (dateMode) {
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, event_updates: [{ id: getActiveEventId(), ...payload }] }),
    });
  } else {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  prep.event.creative_touches.selected = selected;
}

// ── Step 4: News ─────────────────────────────────────────────────────────────
function getAllNewsItems() {
  const field = (prep.field_news || []).map(n => ({ ...n, _source_type: 'field' }));
  const live = (prep.news_suggestions || []).map(n => ({ ...n, _source_type: 'live' }));
  return [...field, ...live];
}

function newsStepHtml(n) {
  const items = getAllNewsItems();
  const selectedLinks = new Set((prep.event.news_selected || []).map(x => x.link));
  const fieldItems = items.filter(x => x._source_type === 'field');
  const liveItems = items.filter(x => x._source_type === 'live');

  if (!items.length) return `<div class="section-title">${n}. News for this brief</div><p class="empty-state">No news found right now.</p>`;

  let html = `<div class="section-title">${n}. News for this brief</div>`;
  let idx = 0;

  if (fieldItems.length) {
    html += `<div style="font-size:12px;font-weight:600;color:var(--accent);margin:10px 0 6px;text-transform:uppercase;letter-spacing:0.5px">Field Reports (submitted today)</div>`;
    fieldItems.forEach(item => {
      const checked = selectedLinks.has(item.link) ? 'checked' : '';
      html += `<div class="checklist-item"><input type="checkbox" id="news-${idx}" ${checked}><label for="news-${idx}">${item.link ? `<a href="${item.link}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>` : escapeHtml(item.title)} ${item.source ? '· ' + item.source : ''}</label></div>`;
      idx++;
    });
  }

  if (liveItems.length) {
    html += `<div style="font-size:12px;font-weight:600;color:var(--stone-500);margin:14px 0 6px;text-transform:uppercase;letter-spacing:0.5px">Live News (auto-scraped)</div>`;
    liveItems.forEach(item => {
      const checked = selectedLinks.has(item.link) ? 'checked' : '';
      html += `<div class="checklist-item"><input type="checkbox" id="news-${idx}" ${checked}><label for="news-${idx}"><a href="${item.link}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a> ${item.mandal_tag ? '· ' + item.mandal_tag : ''} ${item.source ? '· ' + item.source : ''}</label></div>`;
      idx++;
    });
  }

  html += `<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="saveNewsSelection()">Save selection</button></div>`;
  return html;
}

async function saveNewsSelection() {
  const items = getAllNewsItems();
  const selected = items.filter((n, i) => document.getElementById(`news-${i}`)?.checked)
    .map(({ _source_type, ...rest }) => rest);
  if (dateMode) {
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, news_selected: selected }),
    });
  } else {
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ news_selected: selected }),
    });
  }
  await refreshPrep();
}

// ── Step 5: Preview & Generate ───────────────────────────────────────────────
function previewStepHtml(n) {
  const notedContacts = prep.contacts.filter(c => c.note && c.note.trim());
  const newsSelected = dateMode ? (prep.news_selected || []) : (prep.event.news_selected || []);

  let speechHtml = '';
  if (dateMode) {
    (prep.events || []).forEach(ev => {
      speechHtml += `
        <div style="margin-bottom:8px">
          <div style="font-size:12px;font-weight:600;color:var(--stone-500)">${escapeHtml(ev.event_name)}</div>
          <textarea id="preview-speech-${ev.id}" style="min-height:70px">${escapeHtml(ev.speech_points)}</textarea>
        </div>`;
    });
  } else {
    speechHtml = `<textarea id="preview-speech" style="min-height:90px">${escapeHtml(prep.event.speech_points)}</textarea>`;
  }

  const ev = dateMode ? (prep.events[0] || {}) : prep.event;

  return `
    <div class="section-title">${n}. Preview — review before generating</div>

    <div class="preview-section">
      <h4>Contacts with notes (${notedContacts.length} of ${prep.contacts.length})</h4>
      ${notedContacts.length ? notedContacts.map(c => `
        <div class="preview-contact"><span class="pc-name">${c.name}</span> · ${c.phone}${c.event_name ? ` · <span style="font-size:11px;color:var(--stone-500)">${c.event_name}</span>` : ''}<div class="preview-note">${escapeHtml(c.note)}</div></div>
      `).join('') : '<p class="empty-state">No notes written yet.</p>'}
      <span class="reset-link" onclick="jumpToStep(stepIndexOf('contacts'))">Edit contacts &amp; notes</span>
    </div>

    <div class="preview-section">
      <h4>Speech points${dateMode && prep.events.length > 1 ? ` (${prep.events.length} events)` : ''}</h4>
      ${speechHtml}
      <div style="margin-top:6px"><button class="btn btn-secondary btn-sm" onclick="savePreviewSpeech()">Save edit</button></div>
    </div>

    <div class="preview-section">
      <h4>Creative touches</h4>
      ${(ev.creative_touches?.custom || []).length || (ev.creative_touches?.selected || []).length
        ? `<ul style="padding-left:18px;font-size:13px">${[...(ev.creative_touches?.custom||[])].map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul>`
        : '<p class="empty-state">None added yet.</p>'}
      <span class="reset-link" onclick="jumpToStep(stepIndexOf('creative'))">Edit creative touches</span>
    </div>

    <div class="preview-section">
      <h4>News (${newsSelected.length} selected)</h4>
      ${newsSelected.length
        ? `<ul style="padding-left:18px;font-size:13px">${newsSelected.map(n=>`<li>${escapeHtml(n.title)}</li>`).join('')}</ul>`
        : '<p class="empty-state">None picked — the PDF will fall back to top auto-scraped items, clearly labelled.</p>'}
      <span class="reset-link" onclick="jumpToStep(stepIndexOf('news'))">Edit news picks</span>
    </div>

    <button class="btn btn-accent btn-block" style="padding:14px;font-size:15px" onclick="generatePdf()">
      Generate Final Brief PDF
    </button>
  `;
}

async function savePreviewSpeech() {
  if (dateMode) {
    const updates = (prep.events || []).map(ev => {
      const el = document.getElementById(`preview-speech-${ev.id}`);
      return { id: ev.id, speech_points: el ? el.value : (ev.speech_points || '') };
    });
    await fetch('/api/daily-prep', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: dateMode, event_updates: updates }),
    });
  } else {
    const text = document.getElementById('preview-speech').value;
    await fetch(`/api/schedule/${eventId}/prep`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ speech_points: text, speech_points_reviewed: !!text.trim() }),
    });
  }
  await refreshPrep();
}

function generatePdf() {
  const d = dateMode || prep.event.date;
  window.open(`/api/brief-pdf?date=${d}`, '_blank');
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  await loadMpName();
  if (dateMode) {
    document.getElementById('wizard').style.display = 'block';
    await refreshPrep();
  } else if (!eventId) {
    document.getElementById('no-event-form').style.display = 'block';
    document.getElementById('event-subtitle').textContent = 'Create an event to begin preparing its brief.';
    document.getElementById('sch-date').value = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
  } else {
    document.getElementById('wizard').style.display = 'block';
    await refreshPrep();
  }
})();
</script>
</body>
</html>
