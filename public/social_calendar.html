<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Social Media Calendar · Saathi Palnadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest" defer></script>
<script src="/sidebar.js" defer></script>
<script src="/js/saathi-ui.js" defer></script>
<style>
.container { padding: 24px 32px; }
.form-hint{font-size:11px;color:var(--stone-500);margin-top:4px}

/* Post cards */
.posts-grid{display:flex;flex-direction:column;gap:12px}
.post-card{padding:14px}
.post-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.post-date{font-size:12px;font-weight:700;color:var(--accent)}
.post-actions{display:flex;gap:6px}
.media-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.media-thumb{width:120px;height:120px;border-radius:var(--radius-sm);overflow:hidden;background:#f3f4f6;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover}
.media-pdf-chip{width:120px;height:120px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--stone-700);font-size:11px;text-align:center;padding:8px}
.media-pdf-chip i{width:28px;height:28px;color:var(--accent)}
.post-caption{font-size:13px;color:var(--ink);white-space:pre-wrap}
.post-caption .no-caption{color:var(--stone-400)}
.caption-edit textarea{width:100%;margin-bottom:8px}
.caption-edit-actions{display:flex;gap:8px}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <div><h1 class="page-title">Social Media Calendar</h1></div>
    <div class="page-header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">
        <i data-lucide="plus"></i> Add Post
      </button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Calendar</div>
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&lsaquo;</button>
      <div>
        <span id="cal-month-label" class="cal-month-label"></span>
        <button class="cal-today-btn" onclick="jumpToday()">Today</button>
      </div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid" style="margin-top:4px"></div>
  </div>

  <div class="card">
    <div class="section-title" id="list-title">All posts</div>
    <div class="cal-filter-bar" id="cal-filter-bar" style="display:none">
      <span id="cal-filter-label"></span>
      <button class="cal-clear-btn" onclick="clearDateFilter()">Show all</button>
    </div>
    <div class="posts-grid" id="posts-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none">No posts found.</div>
  </div>
</div>

<!-- ADD POST MODAL -->
<div id="add-modal" class="modal-overlay" onclick="closeModals()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Add Social Media Post</h3>
    <div class="form-group">
      <label>Date *</label>
      <input type="date" id="add-date">
    </div>
    <div class="form-group">
      <label>Media (images, videos, PDFs) *</label>
      <div class="file-drop" onclick="document.getElementById('add-media').click()">
        <i data-lucide="image-plus"></i><br>
        Click to choose photos, videos, or PDFs
      </div>
      <input type="file" id="add-media" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm,application/pdf" style="display:none" onchange="onMediaChosen()">
      <div class="form-hint">You can select several files at once (e.g. a carousel of images).</div>
      <div class="file-preview-list" id="file-preview-list"></div>
    </div>
    <div class="form-group">
      <label>Caption</label>
      <textarea id="add-caption" placeholder="Post caption..." rows="4"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="add-submit-btn" onclick="submitAdd()">Save Post</button>
      <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (window.lucide) lucide.createIcons();
  await loadPosts();
  // Arriving from admin.html's search: /social_calendar.html?id=<post id>. No
  // date filter is applied on first load, so every post is rendered.
  const id = SaathiUI.deepLinkId();
  if (id) SaathiUI.revealRecord(document.getElementById('card-' + id), { label: 'post' });
});

let allPosts = [];
let selectedDateFilter = null;

function getTodayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

const [__ty, __tm] = getTodayIST().split('-').map(Number);
let calViewYear = __ty;
let calViewMonth = __tm - 1;

const CAL_WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CAL_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadPosts() {
  const r = await fetch('/api/social-calendar');
  const data = await r.json();
  allPosts = data.posts || [];
  renderCalendar();
  renderPosts();
}

function renderCalendar() {
  const todayIST = getTodayIST();
  const countByDate = {};
  allPosts.forEach(p => { countByDate[p.date] = (countByDate[p.date] || 0) + 1; });

  document.getElementById('cal-month-label').textContent = `${CAL_MONTHS[calViewMonth]} ${calViewYear}`;
  document.getElementById('cal-weekdays').innerHTML = CAL_WEEKDAYS.map(d => `<div class="cal-weekday">${d}</div>`).join('');

  const firstDayOffset = new Date(calViewYear, calViewMonth, 1).getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const pad = n => String(n).padStart(2, '0');

  let cellsHtml = '';
  for (let i = 0; i < firstDayOffset; i++) cellsHtml += '<div class="cal-day other-month"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calViewYear}-${pad(calViewMonth + 1)}-${pad(day)}`;
    const count = countByDate[dateStr] || 0;
    const classes = ['cal-day'];
    if (dateStr === todayIST) classes.push('today');
    if (dateStr === selectedDateFilter) classes.push('selected');
    cellsHtml += `<div class="${classes.join(' ')}" onclick="onCalDayClick('${dateStr}', ${count > 0})">
      ${day}
      ${count > 0 ? `<span class="cal-dot">${count}</span>` : ''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cellsHtml;
}

function changeMonth(delta) {
  calViewMonth += delta;
  if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  renderCalendar();
}
function jumpToday() {
  const [ty, tm] = getTodayIST().split('-').map(Number);
  calViewYear = ty; calViewMonth = tm - 1;
  renderCalendar();
}
function onCalDayClick(dateStr, hasPosts) {
  if (!hasPosts) return;
  selectedDateFilter = selectedDateFilter === dateStr ? null : dateStr;
  renderCalendar();
  renderPosts();
}
function clearDateFilter() {
  selectedDateFilter = null;
  renderCalendar();
  renderPosts();
}

function mediaCellHtml(post, m) {
  const src = `/api/social-calendar/media/${encodeURIComponent(m.filename)}`;
  if (m.type === 'image') return `<div class="media-thumb"><img src="${src}" loading="lazy"></div>`;
  if (m.type === 'video') return `<div class="media-thumb"><video src="${src}" controls></video></div>`;
  return `<a class="media-pdf-chip" href="${src}" target="_blank"><i data-lucide="file-text"></i> PDF</a>`;
}

function renderPosts() {
  const filterBar = document.getElementById('cal-filter-bar');
  const filterLabel = document.getElementById('cal-filter-label');
  const titleEl = document.getElementById('list-title');
  const grid = document.getElementById('posts-grid');
  const emptyEl = document.getElementById('empty-state');

  let posts = allPosts;
  if (selectedDateFilter) {
    filterBar.style.display = 'flex';
    filterLabel.textContent = `Showing posts for ${selectedDateFilter}`;
    titleEl.textContent = `Posts on ${selectedDateFilter}`;
    posts = posts.filter(p => p.date === selectedDateFilter);
  } else {
    filterBar.style.display = 'none';
    titleEl.textContent = 'All posts';
  }
  posts = [...posts].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));

  if (!posts.length) {
    grid.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  grid.innerHTML = posts.map(p => `
    <div class="post-card card-sub" id="card-${p.id}">
      <div class="post-card-header">
        <span class="post-date">${p.date}</span>
        <div class="post-actions">
          <button class="btn btn-sm btn-ghost" onclick="startEditCaption('${p.id}')"><i data-lucide="pencil"></i> Edit caption</button>
          <button class="btn btn-sm btn-danger" onclick="deletePost('${p.id}')"><i data-lucide="trash-2"></i> Delete</button>
        </div>
      </div>
      <div class="media-grid">${(p.media || []).map(m => mediaCellHtml(p, m)).join('')}</div>
      <div class="post-caption-wrap" id="caption-wrap-${p.id}">
        <div class="post-caption">${esc(p.caption) || '<span class="no-caption">No caption</span>'}</div>
      </div>
    </div>
  `).join('');

  if (window.lucide) lucide.createIcons();
}

function startEditCaption(id) {
  const post = allPosts.find(p => p.id === id);
  if (!post) return;
  const wrap = document.getElementById(`caption-wrap-${id}`);
  wrap.innerHTML = `
    <div class="caption-edit">
      <textarea id="caption-input-${id}" rows="3">${esc(post.caption)}</textarea>
      <div class="caption-edit-actions">
        <button class="btn btn-sm btn-success" onclick="saveCaption('${id}')">Save</button>
        <button class="btn btn-sm btn-ghost" onclick="renderPosts()">Cancel</button>
      </div>
    </div>
  `;
}

async function saveCaption(id) {
  const caption = document.getElementById(`caption-input-${id}`).value;
  const r = await fetch(`/api/social-calendar/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption }),
  });
  if (!r.ok) { SaathiUI.toast('Failed to save caption.', 'danger'); return; }
  SaathiUI.toast('Caption updated.', 'success');
  await loadPosts();
}

async function deletePost(id) {
  if (!(await SaathiUI.confirm('Delete this post and its media? This cannot be undone.'))) return;
  const r = await fetch(`/api/social-calendar/${id}`, { method: 'DELETE' });
  if (!r.ok) { SaathiUI.toast('Failed to delete post.', 'danger'); return; }
  SaathiUI.toast('Post deleted.', 'success');
  await loadPosts();
}

function openAddModal() {
  document.getElementById('add-date').value = selectedDateFilter || getTodayIST();
  document.getElementById('add-caption').value = '';
  document.getElementById('add-media').value = '';
  document.getElementById('file-preview-list').innerHTML = '';
  document.getElementById('add-modal').style.display = 'flex';
}
function closeModals() {
  document.getElementById('add-modal').style.display = 'none';
}

function onMediaChosen() {
  const files = document.getElementById('add-media').files;
  const list = document.getElementById('file-preview-list');
  list.innerHTML = Array.from(files).map(f => `<div class="file-preview-item"><i data-lucide="paperclip"></i> ${esc(f.name)}</div>`).join('');
  if (window.lucide) lucide.createIcons();
}

async function submitAdd() {
  const date = document.getElementById('add-date').value;
  const files = document.getElementById('add-media').files;
  const caption = document.getElementById('add-caption').value;
  if (!date) { SaathiUI.toast('Date is required.', 'danger'); return; }
  if (!files.length) { SaathiUI.toast('At least one media file is required.', 'danger'); return; }

  const btn = document.getElementById('add-submit-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const fd = new FormData();
    fd.append('date', date);
    fd.append('caption', caption);
    Array.from(files).forEach(f => fd.append('media', f));
    const r = await fetch('/api/social-calendar', { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok) { SaathiUI.toast(data.error || 'Failed to save post.', 'danger'); return; }
    closeModals();
    selectedDateFilter = date;
    SaathiUI.toast('Post saved.', 'success');
    await loadPosts();
  } finally {
    btn.disabled = false; btn.textContent = 'Save Post';
  }
}
</script>
</body>
</html>
