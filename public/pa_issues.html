<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PA Issue Tracker · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#fafaf9;color:#1a1208;min-height:100vh;padding:0}
body::before{content:'';display:block;height:3px;background:linear-gradient(90deg,#b45309,#d97706,#b45309);position:fixed;top:0;left:0;right:0;z-index:999}
.container{width:100%;padding:24px 32px;margin-top:3px}
.back-link{display:inline-block;margin-bottom:16px;font-size:13px;color:#b45309;text-decoration:none}
.back-link:hover{color:#92400e}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;color:#1a1208}
.btn{padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;border:none;font-size:13px;transition:background .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#1a1208;color:#fff}
.btn-primary:hover{background:#374151}
.btn-secondary{background:#fff;border:1px solid #e5e5e5;color:#1a1208}
.btn-secondary:hover{background:#f9fafb}
.btn-accent{background:#b45309;color:#fff}
.btn-accent:hover{background:#92400e}
.card{background:#fff;border:1px solid #e5e5e5;border-top:3px solid #b45309;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.section-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:14px;padding-left:12px;border-left:3px solid #d97706}
.search-box{display:flex;gap:10px;margin-bottom:14px}
.search-input{flex:1;padding:10px 12px;border:1px solid #d4d4d4;border-radius:6px;font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s}
.search-input:focus{border-color:#b45309;outline:none;box-shadow:0 0 0 2px rgba(180,83,9,0.12)}
.contact-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e5e5e5;border-radius:6px;margin-bottom:8px;background:#fff;cursor:pointer;transition:background .1s}
.contact-item:hover{background:#fafaf9}
.contact-name{font-weight:600;font-size:14px}
.contact-meta{font-size:12px;color:#6b7280;margin-top:2px}
.contact-action{color:#b45309;font-weight:600;font-size:13px;white-space:nowrap}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block;margin-left:6px}
.issue-item{padding:14px;border:1px solid #e5e5e5;border-radius:6px;margin-bottom:8px;background:#fff}
.issue-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.issue-type{font-weight:600;font-size:14px}
.issue-meta{font-size:12px;color:#6b7280;margin-top:2px}
.issue-desc{font-size:13px;color:#374151;margin-top:6px;line-height:1.5}
.tag-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.empty-state{font-size:13px;color:#6b7280;padding:8px 0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:8px;width:100%;max-width:480px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,0.15)}
.modal h3{font-size:16px;font-weight:700;color:#1a1208;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:10px 12px;border:1px solid #d4d4d4;border-radius:6px;
  font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s,box-shadow .15s
}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:#b45309;outline:none;box-shadow:0 0 0 2px rgba(180,83,9,0.12)
}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Back to Portal</a>
  <div class="header">
    <h1>Issue & Grievance Tracker</h1>
    <button class="btn btn-primary" onclick="openCreateContact()">
      <i data-lucide="user-plus" style="width:15px;height:15px"></i> New Contact
    </button>
  </div>

  <div class="card">
    <div class="section-title">Search contact to log issue</div>
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search by name, village, or phone..." oninput="debouncedSearch()">
    </div>
    <div id="search-results"></div>
  </div>

  <div class="section-title" style="margin-top:28px;margin-bottom:12px">Recent issues</div>
  <div id="issues-list"></div>
</div>

<!-- LOG ISSUE MODAL -->
<div id="issue-modal" class="modal-overlay" onclick="closeModals()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title">Log Issue for </h3>
    <div class="form-group">
      <label>Issue type</label>
      <select id="iss-type">
        <option value="General">General Grievance</option>
        <option value="Recommendation Letter">Recommendation Letter</option>
        <option value="TTD Darshan">TTD Darshan Approval</option>
        <option value="Medical Help">Medical/CM Relief Fund</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description / details</label>
      <textarea id="iss-desc" placeholder="Describe the request or issue..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitIssue()">Log Issue</button>
      <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<!-- CREATE CONTACT MODAL -->
<div id="contact-modal" class="modal-overlay" onclick="closeModals()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Create New Contact</h3>
    <div class="form-group">
      <label>Full name *</label>
      <input id="c-name" placeholder="Contact Name">
    </div>
    <div class="form-group">
      <label>Phone number *</label>
      <input id="c-phone" placeholder="10-digit mobile">
    </div>
    <div class="form-group">
      <label>Mandal *</label>
      <select id="c-mandal">
        <option value="">Select Mandal</option>
        <option>Amaravathi</option><option>Atchampet</option><option>Bellamkonda</option><option>Krosuru</option>
        <option>Muppalla</option><option>Nekarikallu</option><option>Pedakurapadu</option><option>Rajupalem</option>
        <option>Sattenapalli</option><option>Bollapalle</option><option>Chilakaluripet</option><option>Edlapadu</option>
        <option>Ipuru</option><option>Nadendla</option><option>Narasaraopet</option><option>Nuzendla</option>
        <option>Rompicherla</option><option>Savalyapuram</option><option>Vinukonda</option><option>Dachepalle</option>
        <option>Durgi</option><option>Gurazala</option><option>Karempudi</option><option>Machavaram</option>
        <option>Macherla</option><option>Piduguralla</option><option>Rentachintala</option><option>Veldurthi</option>
      </select>
    </div>
    <div class="form-group">
      <label>Village</label>
      <input id="c-village" placeholder="Village name">
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitContact()">Create & Next</button>
      <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

let searchTimeout = null;
let selectedContactId = null;

async function loadIssues() {
  const r = await fetch('/api/dashboard');
  const db = await r.json();
  let html = '';
  const allIssues = [];
  db.all_contacts.forEach(c => {
    (c.issues || []).forEach(iss => {
      allIssues.push({...iss, contact_name: c.name, village: c.village});
    });
  });
  allIssues.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  if (allIssues.length === 0) html = '<p class="empty-state">No issues logged yet.</p>';
  allIssues.slice(0, 20).forEach(iss => {
    const statusTag = iss.status !== 'none' ? `<span class="tag-status">${iss.status}</span>` : '';
    html += `
    <div class="issue-item">
      <div class="issue-header">
        <div>
          <div class="issue-type">${iss.type} for ${iss.contact_name}</div>
          <div class="issue-meta">${iss.village} &middot; ${new Date(iss.created_at).toLocaleDateString()}</div>
          <div class="issue-desc">${iss.description}</div>
        </div>
        <div>${statusTag}</div>
      </div>
    </div>`;
  });
  document.getElementById('issues-list').innerHTML = html;
}

function debouncedSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(search, 300);
}

async function search() {
  const q = document.getElementById('search-input').value;
  if (q.length < 2) { document.getElementById('search-results').innerHTML = ''; return; }
  const r = await fetch(`/api/contacts?q=${encodeURIComponent(q)}`);
  const data = await r.json();
  let html = '';
  data.contacts.slice(0, 5).forEach(c => {
    html += `
    <div class="contact-item" onclick="openLogIssue('${c.id}', '${c.name}')">
      <div>
        <div class="contact-name">${c.name}</div>
        <div class="contact-meta">${c.phone} &middot; ${c.village}, ${c.mandal}</div>
      </div>
      <div class="contact-action">Log Issue &rarr;</div>
    </div>`;
  });
  if (data.contacts.length === 0) html = '<p class="empty-state">No contact found. Click "New Contact" to create one.</p>';
  document.getElementById('search-results').innerHTML = html;
}

function openLogIssue(id, name) {
  selectedContactId = id;
  document.getElementById('modal-title').textContent = `Log Issue for ${name}`;
  document.getElementById('issue-modal').style.display = 'flex';
}

function openCreateContact() {
  document.getElementById('contact-modal').style.display = 'flex';
}

function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
}

async function submitIssue() {
  const type = document.getElementById('iss-type').value;
  const desc = document.getElementById('iss-desc').value;
  const r = await fetch('/api/issue', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contact_id: selectedContactId, type, description: desc})
  });
  if (r.ok) {
    alert('Issue logged successfully!');
    closeModals();
    loadIssues();
  }
}

async function submitContact() {
  const name = document.getElementById('c-name').value;
  const phone = document.getElementById('c-phone').value;
  const mandal = document.getElementById('c-mandal').value;
  const village = document.getElementById('c-village').value;
  if (!name || !phone || !mandal) { alert('Fill required fields.'); return; }

  const r = await fetch('/api/contact', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, phone, mandal, village})
  });
  const data = await r.json();
  if (r.ok) {
    closeModals();
    openLogIssue(data.contact.id, data.contact.name);
  }
}

loadIssues();
</script>
</body>
</html>
