<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>News Dashboard · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--bg:#fafaf9;--card:#fff;--border:#e5e5e5;
  --muted:#6b7280;--accent:#b45309;--shadow:0 1px 2px rgba(0,0,0,0.05);
  --national:#1d4ed8;--national-bg:#eff6ff;--national-border:#bfdbfe;
  --intl:#7c3aed;--intl-bg:#f5f3ff;--intl-border:#ddd6fe;
  --radius:8px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:28px 16px}
.container{max-width:720px;margin:0 auto}

.page-header{margin-bottom:24px}
.page-header h1{font-size:22px;font-weight:700;color:var(--ink)}
.page-header p{font-size:13px;color:var(--muted);margin-top:4px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.date-input{
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;font-family:inherit;background:var(--card);color:var(--ink);
  cursor:pointer;transition:border-color .15s
}
.date-input:focus{outline:none;border-color:var(--accent)}
.filter-btn{
  padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;font-weight:500;background:var(--card);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:all .15s;
  display:flex;align-items:center;gap:5px
}
.filter-btn.active,.filter-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-btn [data-lucide]{width:12px;height:12px}
.count-badge{
  margin-left:auto;font-size:12px;color:var(--muted);
  background:#f3f4f6;border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;font-weight:500
}

.news-list{display:flex;flex-direction:column;gap:12px}

.news-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px
}
.card-top{display:flex;align-items:flex-start;gap:10px}
.category-badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  white-space:nowrap;flex-shrink:0;margin-top:2px
}
.badge-national{background:var(--national-bg);color:var(--national);border:1px solid var(--national-border)}
.badge-international{background:var(--intl-bg);color:var(--intl);border:1px solid var(--intl-border)}
.badge-other{background:#f3f4f6;color:var(--muted);border:1px solid var(--border)}

.headline{font-size:15px;font-weight:600;color:var(--ink);line-height:1.4}
.body-text{font-size:13px;color:#374151;line-height:1.6}
.card-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meta-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.meta-item [data-lucide]{width:12px;height:12px}
.read-link{
  display:inline-flex;align-items:center;gap:5px;margin-top:2px;
  font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;
  transition:opacity .15s
}
.read-link:hover{opacity:0.75}
.read-link [data-lucide]{width:13px;height:13px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty [data-lucide]{width:36px;height:36px;margin:0 auto 12px;display:block;opacity:0.35}
.empty p{font-size:14px}

.loading{text-align:center;padding:48px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>📰 News Dashboard</h1>
    <p>All submitted news reports · Palanadu Constituency</p>
  </div>

  <div class="toolbar">
    <input type="date" class="date-input" id="dateFilter"/>
    <button class="filter-btn active" id="btnAll" onclick="setFilter('all')">
      <i data-lucide="layers"></i> All
    </button>
    <button class="filter-btn" id="btnNational" onclick="setFilter('National')">
      <i data-lucide="flag"></i> National
    </button>
    <button class="filter-btn" id="btnIntl" onclick="setFilter('International')">
      <i data-lucide="globe"></i> International
    </button>
    <span class="count-badge" id="countBadge">0 reports</span>
  </div>

  <div class="news-list" id="newsList">
    <div class="loading">Loading…</div>
  </div>
</div>

<script>
let allNews = [];
let activeCategory = 'all';

function todayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function formatTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function badgeClass(cat) {
  if (!cat) return 'badge-other';
  if (cat === 'National') return 'badge-national';
  if (cat === 'International') return 'badge-international';
  return 'badge-other';
}

function render() {
  const list = document.getElementById('newsList');
  const filtered = activeCategory === 'all'
    ? allNews
    : allNews.filter(n => n.mandal === activeCategory);

  document.getElementById('countBadge').textContent =
    `${filtered.length} report${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty">
        <i data-lucide="inbox"></i>
        <p>No news reports for this date</p>
      </div>`;
    lucide.createIcons();
    return;
  }

  list.innerHTML = filtered.map(n => {
    const cat = n.mandal || '';
    const hasLink = n.link && n.link.startsWith('http');
    return `
    <div class="news-card">
      <div class="card-top">
        <span class="category-badge ${badgeClass(cat)}">${esc(cat) || 'Report'}</span>
        <div class="headline">${esc(n.headline)}</div>
      </div>
      ${n.body ? `<div class="body-text">${esc(n.body)}</div>` : ''}
      <div class="card-meta">
        ${n.source ? `<span class="meta-item"><i data-lucide="building-2"></i>${esc(n.source)}</span>` : ''}
        ${n.submitted_at ? `<span class="meta-item"><i data-lucide="clock"></i>${formatTime(n.submitted_at)}</span>` : ''}
        ${n.priority === 'high' ? `<span class="meta-item"><i data-lucide="flame"></i>High priority</span>` : ''}
      </div>
      ${hasLink ? `<a class="read-link" href="${esc(n.link)}" target="_blank" rel="noopener">
        Read full article <i data-lucide="external-link"></i>
      </a>` : ''}
    </div>`;
  }).join('');

  lucide.createIcons();
}

async function load() {
  const date = document.getElementById('dateFilter').value;
  const url = date ? `/api/news?date=${date}` : '/api/news';
  try {
    const res = await fetch(url);
    const data = await res.json();
    allNews = data.news || [];
    render();
  } catch (e) {
    document.getElementById('newsList').innerHTML =
      `<div class="empty"><p>Failed to load news</p></div>`;
  }
}

function setFilter(cat) {
  activeCategory = cat;
  ['btnAll','btnNational','btnIntl'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  const map = { all:'btnAll', National:'btnNational', International:'btnIntl' };
  if (map[cat]) document.getElementById(map[cat]).classList.add('active');
  render();
}

document.getElementById('dateFilter').value = todayIST();
document.getElementById('dateFilter').addEventListener('change', load);

load();
</script>
</body>
</html>
