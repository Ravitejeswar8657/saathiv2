<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coverage Heatmap · Saathi Palnadu</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/saathi.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/sidebar.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
.container { padding-top: 28px; }

.results-info { font-size: 13px; color: var(--stone-500); }
.results-info b { color: var(--ink); }

/* ── Toggle bar ── */
.toggle-bar {
  background: var(--card); border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  padding: 14px 16px; margin-bottom: 18px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between;
}
.mode-toggle { display: flex; gap: 5px; flex-wrap: wrap; }

.gap-note {
  font-size: 12px; color: var(--stone-500); display: flex; align-items: center; gap: 5px;
}
.gap-note [data-lucide] { width: 13px; height: 13px; color: var(--stone-400); }

/* ── Map ── */
.map-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  overflow: hidden; position: relative;
}
#map { width: 100%; height: 620px; background: #eef2f1; }

.state-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; color: var(--stone-500); font-size: 14px;
  background: rgba(250,250,249,0.9); z-index: 500;
}
.state-msg [data-lucide] { width: 36px; height: 36px; margin-bottom: 12px; opacity: 0.3; }
.state-msg.hidden { display: none; }

/* ── Legend — sequential amber ramp, validated with the dataviz skill's
   ordinal-ramp checks (monotone L, single hue ≤40° spread, light-end ≥2:1
   contrast on the card surface): #e2a233 → #cc7d16 → #b45309 → #96430c → #7c2d12 ── */
.legend-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
  padding: 10px 12px; font-size: 12px; color: var(--ink);
  line-height: 1.4;
}
.legend-title { font-weight: 700; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--stone-500); }
.legend-gradient {
  width: 140px; height: 10px; border-radius: 4px; margin-bottom: 4px;
  background: linear-gradient(90deg, #e2a233, #cc7d16, #b45309, #96430c, #7c2d12);
}
.legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--stone-500); margin-bottom: 8px; }
.legend-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }

/* ── Leaflet popup content ── */
.mandal-popup { font-family: var(--font-body); min-width: 180px; }
.mandal-popup h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.mandal-popup .pop-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; color: var(--stone-500); }
.mandal-popup .pop-row b { color: var(--ink); }
.mandal-popup .pop-empty { font-size: 12px; color: var(--stone-500); font-style: italic; }

/* ── Leaflet third-party chrome, reskinned to match the app's card language ── */
.leaflet-popup-content-wrapper {
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
  border: 1px solid var(--border); font-family: var(--font-body);
}
.leaflet-popup-tip { box-shadow: var(--shadow-sm); }
.leaflet-container a.leaflet-popup-close-button { color: var(--stone-500); }
.leaflet-container a.leaflet-popup-close-button:hover { color: var(--ink); }
.leaflet-control-zoom {
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-sm) !important;
  box-shadow: var(--shadow-sm) !important;
  overflow: hidden;
}
.leaflet-control-zoom a.leaflet-control-zoom-in,
.leaflet-control-zoom a.leaflet-control-zoom-out {
  background: #fff; color: var(--ink); font-family: var(--font-body);
  border-color: var(--border) !important;
}
.leaflet-control-zoom a:hover { background: var(--bg); }
.leaflet-control-attribution {
  background: rgba(255,255,255,.85) !important;
  font-family: var(--font-body); font-size: 10px; color: var(--stone-500);
  border-radius: var(--radius-sm) 0 0 0;
}
.leaflet-control-attribution a { color: var(--accent); }

@media (max-width: 600px) {
  #map { height: 460px; }
  .page-header { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <div><h1 class="page-title">Coverage Heatmap</h1></div>
    <div class="results-info" id="results-info">Loading…</div>
  </div>

  <div class="toggle-bar">
    <div class="mode-toggle">
      <button class="chip active" data-mode="count" id="mode-count">Contact Density</button>
      <button class="chip" data-mode="pps" id="mode-pps">Priority Score</button>
      <button class="chip" data-mode="grievances" id="mode-grievances">Grievance Hotspots</button>
      <button class="chip" data-mode="visits" id="mode-visits">Visit Coverage</button>
    </div>
    <div class="gap-note" id="gap-note"><i data-lucide="info"></i> Gray markers = mandal with no recorded contacts</div>
  </div>

  <div class="map-card">
    <div id="map"></div>
    <div class="state-msg" id="state-msg">
      <i data-lucide="loader-circle"></i>
      Loading map data…
    </div>
  </div>
</div>

<script>
const MANDAL_ALIAS = {
  'Chilakaluripeta': 'Chilakaluripet',
  'Dachepalli': 'Dachepalle',
  'Gurajala': 'Gurazala',
  'Sattenapalli': 'Sattenapalle',
};
const EXCLUDED_MANDALS = new Set(['Thummalacheruvu', 'Veerapuram']);

let map, heatLayer, markersLayer;
// canonical name -> { lat, lng, count, avgPps, grievanceCount, tiers,
//                      grievanceCountLive, priorityScoreSum, categoryCounts }
let mandalStats = {};
let categoryLabels = {};
let mode = 'count';

function normalizeMandalName(name) {
  return MANDAL_ALIAS[name] || name;
}

async function loadData() {
  const [coordsRes, contactsRes, grievancesRes, categoriesRes, coverageRes] = await Promise.all([
    fetch('/assets/mandal_coords.json'),
    fetch('/api/contacts?limit=5000'),
    fetch('/api/grievances'),
    fetch('/api/grievances/categories'),
    fetch('/api/coverage-report'),
  ]);
  const coords = await coordsRes.json();
  const { contacts } = await contactsRes.json();
  const { items: grievances } = await grievancesRes.json();
  const { categories } = await categoriesRes.json();
  const coverage = await coverageRes.json();
  categoryLabels = Object.fromEntries((categories || []).map(c => [c.key, c.label]));

  // seed every official mandal, even ones with zero contacts
  for (const [name, ll] of Object.entries(coords)) {
    mandalStats[name] = {
      lat: ll.lat, lng: ll.lng, count: 0, ppsSum: 0, grievanceCount: 0, tiers: { T1: 0, T2: 0, T3: 0 },
      grievanceCountLive: 0, priorityScoreSum: 0, categoryCounts: {},
      visitCount: 0, lastVisitDate: '',
    };
  }

  // Stage 2 visit-coverage outcome — inferred from schedule events, see /api/coverage-report.
  for (const v of (coverage.mandals?.visited || [])) {
    const key = normalizeMandalName(v.name);
    const stat = mandalStats[key];
    if (!stat) continue;
    stat.visitCount = v.visit_count;
    stat.lastVisitDate = v.last_visit_date;
  }

  for (const c of contacts) {
    if (!c.mandal) continue;
    if (EXCLUDED_MANDALS.has(c.mandal)) continue;
    const key = normalizeMandalName(c.mandal);
    const stat = mandalStats[key];
    if (!stat) continue; // mandal not in our geocoded set
    stat.count++;
    stat.ppsSum += (c.pps_score || 0);
    if (c.open_grievance) stat.grievanceCount++;
    if (c.tier && stat.tiers[c.tier] !== undefined) stat.tiers[c.tier]++;
  }

  // A separate live signal from the structured grievance register — distinct from
  // the legacy contact.open_grievance flag counted above, so both stay visible.
  for (const g of (grievances || [])) {
    if (!g.mandal || g.resolution_status === 'Resolved') continue;
    if (EXCLUDED_MANDALS.has(g.mandal)) continue;
    const key = normalizeMandalName(g.mandal);
    const stat = mandalStats[key];
    if (!stat) continue;
    stat.grievanceCountLive++;
    stat.priorityScoreSum += (g.priority_score || 0);
    stat.categoryCounts[g.category] = (stat.categoryCounts[g.category] || 0) + 1;
  }

  for (const stat of Object.values(mandalStats)) {
    stat.avgPps = stat.count ? stat.ppsSum / stat.count : 0;
    stat.avgPriorityScore = stat.grievanceCountLive ? stat.priorityScoreSum / stat.grievanceCountLive : 0;
    stat.topCategory = Object.entries(stat.categoryCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
  }

  document.getElementById('results-info').innerHTML =
    `<b>${Object.keys(mandalStats).length}</b> mandals · <b>${contacts.length}</b> contacts · <b>${(grievances || []).length}</b> grievances`;
}

// Tier marker colors map onto the app's shared semantic tokens
// (--accent, --info, --neutral) rather than one-off hex.
const TIER_COLOR_NONE = '#a8a29e';  // --stone-400 (no recorded contacts)
const TIER_COLOR_T1 = '#b45309';   // --accent
const TIER_COLOR_T2 = '#0369a1';   // --info
const TIER_COLOR_T3 = '#475569';   // --neutral

function tierColor(stat) {
  if (stat.count === 0) return TIER_COLOR_NONE;
  if (stat.tiers.T1 >= stat.tiers.T2 && stat.tiers.T1 >= stat.tiers.T3) return TIER_COLOR_T1;
  if (stat.tiers.T2 >= stat.tiers.T3) return TIER_COLOR_T2;
  return TIER_COLOR_T3;
}

// Sequential amber heat ramp — validated with the dataviz skill's ordinal-ramp
// checks (monotone lightness, single hue, light-end contrast ≥2:1 on the map
// surface): node scripts/validate_palette.js "#e2a233,#cc7d16,#b45309,#96430c,#7c2d12"
// --mode light --ordinal --surface "#fafaf9"  →  ALL CHECKS PASS.
// Stops start at 0.35 (not 0) so sparse points still fade to transparent like
// leaflet.heat's default, instead of flooding low-density areas with color.
const HEAT_GRADIENT = {
  0.35: '#e2a233',
  0.5: '#cc7d16',
  0.65: '#b45309',
  0.8: '#96430c',
  1.0: '#7c2d12',
};

function buildMarkersAndHeat() {
  const entries = Object.entries(mandalStats);
  const maxCount = Math.max(1, ...entries.map(([, s]) => s.count));
  const maxPps = Math.max(1, ...entries.map(([, s]) => s.avgPps));
  const maxGrievances = Math.max(1, ...entries.map(([, s]) => s.grievanceCountLive));
  const maxVisits = Math.max(1, ...entries.map(([, s]) => s.visitCount));

  const heatPoints = [];
  const markers = [];

  for (const [name, stat] of entries) {
    const intensity = mode === 'pps' ? (stat.count ? stat.avgPps / maxPps : 0)
      : mode === 'grievances' ? stat.grievanceCountLive / maxGrievances
      : mode === 'visits' ? stat.visitCount / maxVisits
      : stat.count / maxCount;
    const hasPoint = mode === 'grievances' ? stat.grievanceCountLive > 0
      : mode === 'visits' ? stat.visitCount > 0
      : stat.count > 0;

    if (hasPoint) {
      heatPoints.push([stat.lat, stat.lng, Math.max(intensity, 0.08)]);
    }

    const radius = hasPoint ? 8 + Math.round(intensity * 14) : 6;
    const marker = L.circleMarker([stat.lat, stat.lng], {
      radius,
      color: '#fff',
      weight: 1.5,
      fillColor: tierColor(stat),
      fillOpacity: hasPoint ? 0.85 : 0.5,
    });

    const topCategoryLabel = stat.topCategory ? (categoryLabels[stat.topCategory] || stat.topCategory) : '—';
    const popupHtml = stat.count === 0 && stat.grievanceCountLive === 0
      ? `<div class="mandal-popup"><h3>${name}</h3><div class="pop-empty">No contacts recorded</div></div>`
      : `<div class="mandal-popup">
          <h3>${name}</h3>
          <div class="pop-row"><span>Contacts</span><b>${stat.count}</b></div>
          <div class="pop-row"><span>Avg. priority score</span><b>${stat.avgPps.toFixed(1)}</b></div>
          <div class="pop-row"><span>Open grievances (legacy)</span><b>${stat.grievanceCount}</b></div>
          <div class="pop-row"><span>T1 / T2 / T3</span><b>${stat.tiers.T1} / ${stat.tiers.T2} / ${stat.tiers.T3}</b></div>
          <div class="pop-row"><span>Grievances (register)</span><b>${stat.grievanceCountLive}</b></div>
          <div class="pop-row"><span>Top category</span><b>${topCategoryLabel}</b></div>
          <div class="pop-row"><span>Avg. priority score (register)</span><b>${stat.avgPriorityScore.toFixed(1)}</b></div>
          <div class="pop-row"><span>Visits logged</span><b>${stat.visitCount}</b></div>
          <div class="pop-row"><span>Last visit</span><b>${stat.lastVisitDate ? new Date(stat.lastVisitDate + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Never'}</b></div>
        </div>`;
    marker.bindPopup(popupHtml);
    markers.push(marker);
  }

  return { heatPoints, markers };
}

function render() {
  if (heatLayer) map.removeLayer(heatLayer);
  if (markersLayer) map.removeLayer(markersLayer);

  const { heatPoints, markers } = buildMarkersAndHeat();

  heatLayer = L.heatLayer(heatPoints, { radius: 45, blur: 35, maxZoom: 12, gradient: HEAT_GRADIENT }).addTo(map);
  markersLayer = L.layerGroup(markers).addTo(map);
}

function initMap() {
  const points = Object.values(mandalStats).map(s => [s.lat, s.lng]);
  const bounds = L.latLngBounds(points);

  map = L.map('map', { scrollWheelZoom: true }).fitBounds(bounds, { padding: [30, 30] });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18,
  }).addTo(map);

  // Positioned bottomleft (not Leaflet's default bottomright) so this
  // custom control never stacks with Leaflet's own attribution control.
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend-card');
    div.innerHTML = `
      <div class="legend-title">Heat intensity</div>
      <div class="legend-gradient"></div>
      <div class="legend-labels"><span>Low</span><span>High</span></div>
      <div class="legend-row"><span class="legend-dot" style="background:${TIER_COLOR_T1}"></span> T1-heavy mandal</div>
      <div class="legend-row"><span class="legend-dot" style="background:${TIER_COLOR_T2}"></span> T2-heavy mandal</div>
      <div class="legend-row"><span class="legend-dot" style="background:${TIER_COLOR_T3}"></span> T3-heavy mandal</div>
      <div class="legend-row"><span class="legend-dot" style="background:${TIER_COLOR_NONE}"></span> No contacts</div>
    `;
    return div;
  };
  legend.addTo(map);

  render();
}

const GAP_NOTE_TEXT = {
  count: 'Gray markers = mandal with no recorded contacts',
  pps: 'Gray markers = mandal with no recorded contacts',
  grievances: 'Gray markers = mandal with no open grievances in the register',
  visits: 'Gray markers = mandal never visited (no schedule event logged)',
};

document.querySelectorAll('.mode-toggle .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-toggle .chip').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('gap-note').innerHTML = `<i data-lucide="info"></i> ${GAP_NOTE_TEXT[mode] || ''}`;
    if (window.lucide) lucide.createIcons();
    render();
  });
});

(async function main() {
  try {
    await loadData();
    initMap();
    document.getElementById('state-msg').classList.add('hidden');
  } catch (err) {
    console.error(err);
    document.getElementById('state-msg').innerHTML =
      '<i data-lucide="alert-triangle"></i> Failed to load heatmap data.';
    if (window.lucide) lucide.createIcons();
  }
  if (window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
