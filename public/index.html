<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Saathi · Guntur Constituency · TDP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--paper:#fffbeb;--cream:#fef3c7;--rust:#b45309;
  --rust-l:#fef3c7;--teal:#0f766e;--teal-l:#ccfbf1;--sage:#65a30d;
  --dust:#d97706;--muted:#78716c;--white:#fff;--border:#e7e5e4;
  --sidebar:#1c1917;--sidebar-hover:#292524;--sidebar-active:#d97706;
}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);display:flex;height:100vh;overflow:hidden}
/* Sidebar */
#sidebar{width:230px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid #292524}
.sidebar-logo h1{color:#fef3c7;font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.3px}
.sidebar-logo p{color:#78716c;font-size:11px;margin-top:3px}
.sidebar-logo .version{color:#d97706;font-size:10px;margin-top:2px}
nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-section{color:#57534e;font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;color:#a8a29e;font-size:13px;font-weight:500;margin-bottom:1px;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--sidebar-hover);color:#fef3c7}
.nav-item.active{background:#292524;color:#fef3c7;border-left:3px solid var(--sidebar-active)}
.nav-item .icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:#292524;color:#d97706;font-size:10px;padding:1px 6px;border-radius:10px;font-family:monospace;font-weight:600}
.nav-item.active .badge{background:#1c1917;color:#fbbf24}
.sidebar-footer{padding:12px 16px;border-top:1px solid #292524}
.sidebar-footer .to-number{color:#a8a29e;font-size:11px}
.sidebar-footer .number{color:#fef3c7;font-size:13px;font-weight:600;font-family:monospace}
.send-brief-btn{width:100%;margin-top:10px;padding:9px;background:#d97706;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.send-brief-btn:hover{background:#b45309}
.send-brief-btn.sending{background:#78716c;cursor:not-allowed}
/* Main */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:var(--ink)}
.topbar-sub{font-size:12px;color:var(--muted)}
.topbar-right{display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:24px}
/* Cards */
.page{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:20px}
.page-eyebrow{font-size:11px;font-weight:600;color:var(--rust);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.page-title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:var(--ink);line-height:1.2}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}
.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px}
.card+.card{margin-top:12px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
.stat-card .val{font-size:28px;font-weight:700;color:var(--rust);font-family:monospace}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
/* Contact rows */
.contact-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;transition:all .15s;margin-bottom:6px}
.contact-row:hover{border-color:#a8a29e;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.contact-rank{font-family:'Fraunces',serif;font-size:20px;color:var(--border);width:28px;text-align:center;flex-shrink:0}
.contact-score{width:52px;height:52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.contact-score.high{background:var(--rust-l);border-color:#fcd34d}
.contact-score .score-num{font-size:18px;font-weight:700;color:var(--rust);font-family:monospace;line-height:1}
.contact-score .score-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.contact-info{flex:1;min-width:0}
.contact-name{font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.contact-meta{font-size:12px;color:var(--muted);margin-top:2px}
.contact-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.tag-t1{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.tag-t2{background:var(--teal-l);color:#0f766e;border:1px solid #99f6e4}
.tag-t3{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
.tag-grievance{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.tag-driver{background:#f9fafb;color:#374151;border:1px solid var(--border)}
.tag-event{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.contact-days{font-size:11px;font-family:monospace;flex-shrink:0;text-align:right}
.contact-days.cold{color:var(--rust)}
.chevron{color:var(--border);flex-shrink:0}
/* Tier pills */
.tier-t1{background:#fef3c7;color:#92400e}
.tier-t2{background:var(--teal-l);color:var(--teal)}
.tier-t3{background:#f1f5f9;color:#64748b}
/* Party pills */
.party-TDP{background:#fef3c7;color:#92400e}
.party-YSRCP{background:#fef2f2;color:#991b1b}
.party-BJP{background:#fff7ed;color:#c2410c}
.party-Neutral{background:#f1f5f9;color:#64748b}
/* Panel */
#panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);z-index:100;display:none}
#panel-overlay.open{display:flex;justify-content:flex-end}
#panel{width:480px;background:var(--white);height:100%;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
.panel-head{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:1}
.panel-section{padding:18px 20px;border-bottom:1px solid var(--border)}
.panel-section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.why-box{background:var(--cream);border:1px solid #fcd34d;border-left:4px solid var(--rust);border-radius:8px;padding:14px}
.why-box p{font-size:13px;line-height:1.7;color:var(--ink)}
.ai-btn{margin-top:10px;padding:7px 14px;background:var(--rust);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ai-btn:hover{background:var(--ink)}
.ai-btn.loading{background:var(--muted);cursor:not-allowed}
.history-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.history-item:last-child{border:none}
.grievance-box{background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;font-size:12px;color:#991b1b;margin-top:4px}
.commitment-box{background:var(--teal-l);border:1px solid #99f6e4;border-radius:6px;padding:10px;font-size:12px;color:var(--teal);margin-top:4px}
/* Filters */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-input{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1;min-width:200px;background:var(--white)}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--white);cursor:pointer}
/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:#f5f5f4;padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.data-table td{padding:9px 10px;border-bottom:1px solid #f5f5f4;vertical-align:top}
.data-table tr:hover td{background:#fafaf9;cursor:pointer}
/* Issue cards */
.issue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.issue-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px}
.issue-card .heat-bar{height:4px;background:#f5f5f4;border-radius:2px;margin:8px 0}
.issue-card .heat-fill{height:100%;border-radius:2px;background:var(--rust);transition:width .4s}
.trend-rising{color:#dc2626;font-weight:600}
.trend-stable{color:#d97706}
.trend-low{color:var(--muted)}
/* Coverage grid */
.coverage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.coverage-cell{border-radius:8px;padding:12px;border:1px solid transparent}
.coverage-healthy{background:var(--teal-l);border-color:#99f6e4;color:var(--teal)}
.coverage-moderate{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.coverage-warning{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
.coverage-critical{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.coverage-cell .m-name{font-size:12px;font-weight:600}
.coverage-cell .m-days{font-size:11px;font-family:monospace;margin-top:3px}
.coverage-cell .m-contacts{font-size:10px;opacity:.7;margin-top:2px}
/* Schedule form */
.form-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--paper)}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#d97706;box-shadow:0 0 0 2px rgba(217,119,6,.1)}
.submit-btn{padding:10px 20px;background:var(--rust);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.submit-btn:hover{background:var(--ink)}
.submit-btn:disabled{background:var(--muted);cursor:not-allowed}
/* Nearby contacts result */
.nearby-result{background:var(--cream);border:1px solid #fcd34d;border-radius:8px;padding:14px;margin-top:12px}
.nearby-result h4{font-size:13px;font-weight:600;color:var(--rust);margin-bottom:10px}
.nearby-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #fcd34d;font-size:12px}
.nearby-item:last-child{border:none}
/* WhatsApp preview */
.wa-preview{background:#0b141a;border-radius:10px;padding:16px;font-family:monospace;font-size:12px;color:#e9edef;white-space:pre-wrap;line-height:1.7;max-height:400px;overflow-y:auto}
.wa-preview b{color:#00a884}
.wa-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:6px;font-size:13px;font-weight:500;margin-top:10px}
.wa-sent{background:var(--teal-l);color:var(--teal)}
.wa-preview-only{background:#fef3c7;color:#92400e}
.wa-error{background:#fef2f2;color:#991b1b}
/* News feed */
.news-item{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px}
.news-item .n-headline{font-size:14px;font-weight:600;color:var(--ink)}
.news-item .n-meta{font-size:11px;color:var(--muted);margin-top:4px}
.news-item .n-body{font-size:12px;color:#57534e;margin-top:6px;line-height:1.6}
.news-item .n-priority-high{border-left:4px solid #dc2626}
.news-item .n-priority-medium{border-left:4px solid var(--dust)}
.news-item .n-priority-low{border-left:4px solid var(--border)}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--rust);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Approve bar */
.approve-bar{background:var(--cream);border:1px solid #fcd34d;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.approve-bar p{font-size:13px;color:#92400e}
.approve-btn{padding:8px 16px;background:var(--teal);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.approve-btn:hover{background:#0d9488}
.approved-badge{background:var(--teal);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
/* Responsive */
@media(max-width:768px){#sidebar{width:180px}.stats-row{grid-template-columns:1fr 1fr}#panel{width:100%}}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-logo">
    <h1>Saathi</h1>
    <p>Guntur Constituency · TDP</p>
    <div class="version">v2.0 · Live Data</div>
  </div>
  <nav>
    <div class="nav-section">Daily Operations</div>
    <button class="nav-item active" onclick="showPage('today')" id="nav-today">
      <span class="icon">◐</span> Today's Brief
      <span class="badge" id="badge-today">15</span>
    </button>
    <button class="nav-item" onclick="showPage('schedule')" id="nav-schedule">
      <span class="icon">📅</span> PA Schedule
      <span class="badge" id="badge-schedule">0</span>
    </button>
    <button class="nav-item" onclick="showPage('news')" id="nav-news">
      <span class="icon">📰</span> News Desk
      <span class="badge" id="badge-news">0</span>
    </button>
    <div class="nav-section">Intelligence</div>
    <button class="nav-item" onclick="showPage('contacts')" id="nav-contacts">
      <span class="icon">◉</span> All Contacts
      <span class="badge" id="badge-contacts">2000</span>
    </button>
    <button class="nav-item" onclick="showPage('issues')" id="nav-issues">
      <span class="icon">◎</span> Issue Radar
    </button>
    <button class="nav-item" onclick="showPage('coverage')" id="nav-coverage">
      <span class="icon">⬡</span> Coverage Map
    </button>
    <div class="nav-section">WhatsApp</div>
    <button class="nav-item" onclick="showPage('whatsapp')" id="nav-whatsapp">
      <span class="icon">💬</span> Send Brief
    </button>
  </nav>
  <div class="sidebar-footer">
    <div class="to-number">Brief goes to</div>
    <div class="number">+91 96523 45570</div>
    <button class="send-brief-btn" id="quick-send-btn" onclick="quickSendBrief()">
      <span>📱</span> Send Brief Now
    </button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="topbar-title">Today's Brief</div>
      <div class="topbar-sub" id="topbar-sub">Loading...</div>
    </div>
    <div class="topbar-right">
      <span id="topbar-stats" style="font-size:12px;color:var(--muted)"></span>
    </div>
  </div>
  <div class="content" id="content">
    <div class="loading"><span class="spinner"></span>Loading Saathi...</div>
  </div>
</div>

<!-- CONTACT PANEL -->
<div id="panel-overlay" onclick="closePanel()">
  <div id="panel" onclick="event.stopPropagation()">
    <div class="panel-head">
      <button onclick="closePanel()" style="background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer">← Back</button>
      <div style="display:flex;gap:8px">
        <button onclick="logCall()" style="padding:6px 14px;background:none;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-weight:500">Log call ✓</button>
        <button id="panel-wa-btn" style="padding:6px 14px;background:var(--teal);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500">📱 WhatsApp</button>
      </div>
    </div>
    <div id="panel-content"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let DB = null;
let currentContact = null;
let currentPage = 'today';
let approved = false;

const API = ''; // relative - same origin

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  await loadDashboard();
  showPage('today');
}

async function loadDashboard() {
  try {
    const r = await fetch(`${API}/api/dashboard`);
    DB = await r.json();
    updateBadges();
    updateTopbarSub();
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="loading" style="color:#dc2626">⚠️ Cannot connect to server. Make sure the Node.js server is running.<br><code style="font-size:11px;margin-top:8px;display:block">node server/index.js</code></div>`;
  }
}

function updateBadges() {
  if (!DB) return;
  document.getElementById('badge-today').textContent = DB.todays_brief?.length || 0;
  document.getElementById('badge-contacts').textContent = (DB.all_contacts?.length || 2000).toLocaleString();
  document.getElementById('badge-news').textContent = DB.news?.length || 0;
  document.getElementById('badge-schedule').textContent = DB.schedule?.length || 0;
}

function updateTopbarSub() {
  if (!DB) return;
  const now = new Date().toLocaleDateString('en-IN', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('topbar-sub').textContent = `${now} · ${DB.metadata?.total_contacts?.toLocaleString() || 2000} contacts`;
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = {
    today: "Today's Brief", contacts: 'All Contacts', issues: 'Issue Radar',
    coverage: 'Coverage Map', schedule: 'PA Schedule', news: 'News Desk', whatsapp: 'Send WhatsApp Brief'
  };
  document.getElementById('topbar-title').textContent = titles[page] || page;
  const pages = { today: renderToday, contacts: renderContacts, issues: renderIssues,
    coverage: renderCoverage, schedule: renderSchedule, news: renderNews, whatsapp: renderWhatsapp };
  if (pages[page]) pages[page]();
}

// ── TODAY'S BRIEF ─────────────────────────────────────────────────────────
function renderToday() {
  if (!DB) return;
  const brief = DB.todays_brief || [];
  let html = `<div class="page">
    <div class="page-header">
      <div class="page-eyebrow">Daily Operations</div>
      <div class="page-title">Today's Priority Contacts</div>
      <div class="page-sub">Ranked by Political Priority Score · governance mode · ${brief.length} contacts queued</div>
    </div>`;

  // Approve bar
  if (!approved) {
    html += `<div class="approve-bar">
      <p>📋 Review the list below, then approve to mark as sent to MP.</p>
      <button class="approve-btn" onclick="approveBrief()">✓ Approve for MP</button>
    </div>`;
  } else {
    html += `<div class="approve-bar" style="background:var(--teal-l);border-color:#99f6e4">
      <p style="color:var(--teal)">✓ Brief approved and ready for MP.</p>
      <div class="approved-badge">✓ Approved</div>
    </div>`;
  }

  // Stats row
  const t1 = brief.filter(c => c.tier === 'T1').length;
  const withGrievance = brief.filter(c => c.open_grievance).length;
  const withEvent = brief.filter(c => c.schedule_event).length;
  html += `<div class="stats-row">
    <div class="stat-card"><div class="val">${brief.length}</div><div class="lbl">In Brief</div></div>
    <div class="stat-card"><div class="val">${t1}</div><div class="lbl">Tier 1</div></div>
    <div class="stat-card"><div class="val">${withGrievance}</div><div class="lbl">Open Grievances</div></div>
    <div class="stat-card"><div class="val">${withEvent}</div><div class="lbl">Near Events</div></div>
  </div>`;

  brief.forEach((c, i) => { html += contactRowHTML(c, i + 1); });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function approveBrief() {
  approved = true;
  renderToday();
}

function contactRowHTML(c, rank) {
  const days = c.days_since_contact || 0;
  const isHot = c.pps_score >= 70;
  const tags = [];
  tags.push(`<span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span>`);
  if (c.open_grievance) tags.push(`<span class="tag tag-grievance">⚠ Grievance</span>`);

  return `<div class="contact-row" onclick="openPanel('${c.id}')">

      <div class="contact-tags">${tags.join('')}</div>
    </div>
    <div class="contact-days ${days > 60 ? 'cold' : ''}">${days}d ago</div>

  </div>`;

async function submitSchedule() {
  const name = document.getElementById('sch-name').value.trim();

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = 'Finding nearby contacts...';

  try {
    const r = await fetch(`${API}/api/schedule`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_name: name, date, mandal,
        time: document.getElementById('sch-time').value,
        village: document.getElementById('sch-village').value,
        address: document.getElementById('sch-address').value,
        description: document.getElementById('sch-desc').value,
      })
    });
    const data = await r.json();

    let html = `<div class="nearby-result">
      <h4>📍 Found ${data.nearby_count} priority contacts near ${mandal}</h4>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">
        These contacts will be boosted in today's brief automatically.
      </p>`;
    data.nearby_contacts.forEach(c => {
      html += `<div class="nearby-item">
        <span><strong>${c.name}</strong> · ${c.village} · ${c.role} · <span class="tag tag-${c.tier.toLowerCase()}">${c.tier}</span>
        ${c.open_grievance ? `<span class="tag tag-grievance">⚠ ${c.open_grievance.slice(0,40)}</span>` : ''}</span>

  } finally {
    btn.disabled = false; btn.textContent = 'Find Nearby Contacts →';
  }
}

async function submitNews() {
  const headline = document.getElementById('news-headline').value.trim();
  if (!headline) { alert('Headline is required.'); return; }
  const fd = new FormData();
  fd.append('headline', headline);
  fd.append('source', document.getElementById('news-source').value);
  fd.append('mandal', document.getElementById('news-mandal').value);
  fd.append('priority', document.getElementById('news-priority').value);
  fd.append('body', document.getElementById('news-body').value);
  const file = document.getElementById('news-file').files[0];
  if (file) fd.append('attachment', file);

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  const status = document.getElementById('news-status');
  try {
    const r = await fetch(`${API}/api/news`, { method: 'POST', body: fd });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    status.textContent = '✓ ' + data.message;
    status.style.color = 'var(--teal)';
    await loadDashboard();
    setTimeout(() => renderNews(), 500);
  } catch(e) {
    status.textContent = '✗ ' + e.message;
    status.style.color = '#dc2626';
  } finally {
    btn.disabled = false; btn.textContent = 'Submit News →';
  }
}

async function deleteNews(id) {
  await fetch(`${API}/api/news/${id}`, { method: 'DELETE' });
  await loadDashboard();
  renderNews();
}

async function sendBrief() {
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = '⏳ Sending...';
  const status = document.getElementById('send-status');
  try {
    const r = await fetch(`${API}/api/send-brief`, { method: 'POST' });
    const data = await r.json();
    await loadDashboard();
    let cls, msg;
    if (data.status === 'sent') {
      cls = 'wa-sent'; msg = `✓ Brief sent to +91 96523 45570`;
    } else if (data.status === 'preview_only') {
      cls = 'wa-preview-only';
      msg = `◉ Preview mode. ${data.note || 'WhatsApp module needs QR scan to activate.'}`;
    } else {
      cls = 'wa-error'; msg = `✗ Error: ${data.error || 'Unknown error'}`;
    }
    status.innerHTML = `<div class="wa-status ${cls}">${msg}</div>`;
    if (currentPage === 'whatsapp') setTimeout(() => renderWhatsapp(), 300);
  } catch(e) {
    status.innerHTML = `<div class="wa-status wa-error">✗ ${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '📱 Send WhatsApp Brief Now';
  }
}

async function quickSendBrief() {
  const btn = document.getElementById('quick-send-btn');
  btn.classList.add('sending'); btn.textContent = '⏳ Sending...';
  try {
    const r = await fetch(`${API}/api/send-brief`, { method: 'POST' });
    const data = await r.json();
    await loadDashboard();
    btn.textContent = data.status === 'sent' ? '✓ Sent!' : '◉ Previewed';
    btn.style.background = data.status === 'sent' ? 'var(--teal)' : '#92400e';
    setTimeout(() => {
      btn.classList.remove('sending'); btn.textContent = '📱 Send Brief Now';
      btn.style.background = '';
    }, 3000);
  } catch(e) {
    btn.textContent = '✗ Failed'; btn.style.background = '#dc2626';
    setTimeout(() => { btn.classList.remove('sending'); btn.textContent = '📱 Send Brief Now'; btn.style.background=''; }, 2000);
  }
}

        <div style="flex:1">
          <div style="font-size:18px;font-weight:700;font-family:'Fraunces',serif">${c.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${c.role} · ${c.village}, ${c.mandal}</div>
          <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
            <span class="tag tag-${c.tier?.toLowerCase()}">${c.tier}</span>
            <span class="tag party-${c.party?.replace(/\s/g,'')}">${c.party}</span>
            ${c.krishna_follower ? '<span class="tag" style="background:#fef3c7;color:#92400e">⭐ Krishna Sir Follower</span>' : ''}
          </div>
        </div>
        <div style="text-align:center;flex-shrink:0">
          <div style="font-size:28px;font-weight:700;color:var(--rust);font-family:monospace">${c.pps_score}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase">PPS Score</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center">
        <div style="background:var(--white);border-radius:6px;padding:8px">
          <div style="font-size:18px;font-weight:700;font-family:monospace;${days>60?'color:#dc2626':''}">${days}d</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase">Last contact</div>
        </div>
        <div style="background:var(--white);border-radius:6px;padding:8px">
          <div style="font-size:18px;font-weight:700;font-family:monospace">${(c.estimated_reach||0).toLocaleString()}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase">Est. reach</div>
        </div>
        <div style="background:var(--white);border-radius:6px;padding:8px">
          <div style="font-size:18px;font-weight:700;color:var(--teal)"><a href="tel:${c.phone}" style="color:inherit;text-decoration:none">📞</a></div>
          <div style="font-size:9px;color:var(--muted);font-family:monospace">${c.phone}</div>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title"><span>◐</span> Why now</div>
      <div class="why-box">
        <p id="why-text">${c.ai_reason || 'No briefing generated yet.'}</p>
      </div>
      <button class="ai-btn" id="ai-gen-btn" onclick="generateAI()">✨ Generate with Claude AI</button>
    </div>`;

  if (c.open_grievance) {
    html += `<div class="panel-section">
      <div class="panel-section-title">⚠️ Open Grievance</div>
      <div class="grievance-box">${c.open_grievance}</div>
    </div>`;
  }

  if (c.previous_commitment) {
    html += `<div class="panel-section">
      <div class="panel-section-title">📋 Previous Commitment</div>
      <div class="commitment-box">${c.previous_commitment}</div>
    </div>`;
  }

  html += `<div class="panel-section">
    <div class="panel-section-title">👤 Profile</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">
      ${[['Occupation', c.occupation],['Religion', c.religion],['Caste', c.caste],
         ['Area of Influence', c.area_of_influence],
         ['Additional Identity', c.additional_identity || '—'],
         ['Date of Birth', c.dob || '—']
        ].map(([k,v]) => `<div><span style="color:var(--muted)">${k}:</span> ${v || '—'}</div>`).join('')}
    </div>
  </div>`;

  if (c.remarks) {
    html += `<div class="panel-section">
      <div class="panel-section-title">📝 Remarks</div>
      <div style="font-size:12px;color:#57534e;line-height:1.7">${c.remarks}</div>
    </div>`;
  }

  html += `<div class="panel-section">
    <div class="panel-section-title">📞 Log Interaction</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="logInteraction('${c.id}','call')" class="submit-btn" style="flex:1">✓ Log Call</button>
      <button onclick="logInteraction('${c.id}','visit')" class="submit-btn" style="flex:1;background:var(--teal)">✓ Log Visit</button>
    </div>
    ${c.last_log ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">Last logged: ${c.last_log.type} · ${new Date(c.last_log.at).toLocaleString('en-IN')}</div>` : ''}
  </div>`;

  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('panel-overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  currentContact = null;
}

async function logInteraction(id, type) {
  await fetch(`${API}/api/log-interaction`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contact_id: id, type, outcome: 'done' }),
  });
  await loadDashboard();
  closePanel();
  if (currentPage === 'today') renderToday();
}

function logCall() {
  if (currentContact) logInteraction(currentContact.id, 'call');
}

async function generateAI() {
  const c = currentContact;
  if (!c) return;
  const btn = document.getElementById('ai-gen-btn');
  btn.classList.add('loading'); btn.textContent = '⏳ Generating...';
  const prompt = `You are a political aide briefing a TDP MP in Guntur, Andhra Pradesh about why they should contact ${c.name} today. Write 2-3 sentences in plain English. Be specific about the political relationship, any open grievance or commitment, and recommend one clear action.

Contact: ${c.name}, ${c.role}, ${c.village}, ${c.mandal}
Party: ${c.party} | Tier: ${c.tier} | Krishna Sir Follower: ${c.krishna_follower}
Days since last contact: ${c.days_since_contact}
Caste: ${c.caste} | Occupation: ${c.occupation}
Open grievance: ${c.open_grievance || 'none'}
Previous commitment: ${c.previous_commitment || 'none'}
Remarks: ${c.remarks?.slice(0,200) || 'none'}

Write ONLY the briefing paragraph. No headers, no bullets.`;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await r.json();
    const text = data.content?.[0]?.text;
    if (text) document.getElementById('why-text').textContent = text;
    else throw new Error('No response');
  } catch(e) {
    document.getElementById('why-text').textContent = `[API unavailable] ${c.ai_reason}`;
  } finally {
    btn.classList.remove('loading'); btn.textContent = '✨ Regenerate';
  }
}

// ── INIT ───────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
