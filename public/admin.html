<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MP Dashboard · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1a1208;
  --bg: #fafaf9;
  --card-bg: #ffffff;
  --border: #e5e5e5;
  --muted: #6b7280;
  --accent: #b45309;
  --accent-hover: #92400e;
  --teal: #0f766e;
  --teal-light: #ccfbf1;
  --red: #dc2626;
  --red-light: #fef2f2;
  --red-border: #fecaca;
  --blue: #1d4ed8;
  --blue-hover: #1e40af;
  --shadow: 0 1px 2px rgba(0,0,0,0.05);
  --radius: 8px;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content:'';display:block;height:3px;
  background:linear-gradient(90deg,#b45309,#d97706,#b45309);
  position:fixed;top:0;left:0;right:0;z-index:999;
}

.container {
  width: 100%;
  padding: 32px 32px;
  margin-top: 3px;
}

/* ── Header ── */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  margin-bottom: 16px;
  transition: color 0.15s;
}
.back-link:hover { color: var(--accent-hover); }

.header { margin-bottom: 32px; }
.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* ── Layout ── */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
}
@media (min-width: 900px) {
  .grid { grid-template-columns: 1fr 360px; }
}

/* ── Cards ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ── Section headings ── */
.section-header {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  padding-bottom: 10px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-header [data-lucide] {
  width: 14px;
  height: 14px;
  stroke-width: 2;
}

.section-block { margin-bottom: 40px; }
.section-block:last-child { margin-bottom: 0; }

/* ── Tables / Issue rows ── */
.issue-table {
  width: 100%;
  border-collapse: collapse;
}
.issue-table td {
  padding: 14px 0;
  vertical-align: top;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.issue-table tr:last-child td { border-bottom: none; }
.issue-table .col-info { padding-right: 16px; }
.issue-table .col-actions {
  white-space: nowrap;
  text-align: right;
  vertical-align: middle;
}
.issue-type {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 2px;
}
.issue-meta {
  font-size: 12px;
  color: var(--muted);
}
.issue-desc {
  font-size: 13px;
  color: #374151;
  margin-top: 4px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: 500;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  line-height: 1.4;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn [data-lucide] {
  width: 14px;
  height: 14px;
  stroke-width: 2;
}

/* Primary (teal) */
.btn-primary {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}
.btn-primary:hover:not(:disabled) { background: #0d6357; border-color: #0d6357; }

/* Destructive outline */
.btn-destructive {
  background: transparent;
  color: var(--red);
  border-color: var(--red-border);
}
.btn-destructive:hover:not(:disabled) { background: var(--red-light); }

/* Ghost */
.btn-ghost {
  background: transparent;
  color: var(--muted);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { background: #f5f5f4; color: var(--ink); }

/* Accent filled */
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }

/* Blue filled */
.btn-blue {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.btn-blue:hover:not(:disabled) { background: var(--blue-hover); border-color: var(--blue-hover); }

.btn-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* ── WA Response rows ── */
.wa-response-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.wa-response-item:last-child { border-bottom: none; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.badge-approved { background: var(--teal-light); color: var(--teal); }
.badge-rejected { background: var(--red-light); color: var(--red); }

/* ── News list ── */
.news-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.news-item:last-child { border-bottom: none; }
.news-headline { font-weight: 500; font-size: 14px; }
.news-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.news-body { font-size: 13px; color: #374151; margin-top: 4px; }

.live-news-item {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.live-news-item:last-child { border-bottom: none; }
.live-news-item a {
  color: var(--ink);
  text-decoration: none;
  font-weight: 500;
  font-size: 13px;
}
.live-news-item a:hover { color: var(--accent); }
.live-news-item .news-meta { margin-top: 2px; }

/* ── News Dashboard ── */
.nd-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.nd-date {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.nd-date:focus { outline: none; border-color: var(--accent); }
.nd-filter {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  background: var(--bg);
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.nd-filter.active, .nd-filter:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.nd-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  background: #f3f4f6;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 9px;
  font-weight: 500;
}
.nd-card {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nd-card:last-child { border-bottom: none; }
.nd-card-top { display: flex; align-items: flex-start; gap: 8px; }
.cat-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}
.cat-national { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.cat-international { background: #f5f3ff; color: #7c3aed; border: 1px solid #ddd6fe; }
.cat-other { background: #f3f4f6; color: var(--muted); border: 1px solid var(--border); }
.nd-headline { font-weight: 600; font-size: 14px; line-height: 1.4; }
.nd-body { font-size: 13px; color: #374151; line-height: 1.5; }
.nd-meta { display: flex; gap: 12px; flex-wrap: wrap; }
.nd-meta span { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; }
.nd-meta span [data-lucide] { width: 11px; height: 11px; }
.nd-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  text-decoration: none;
}
.nd-link:hover { opacity: 0.75; }
.nd-link [data-lucide] { width: 12px; height: 12px; }

/* ── Sidebar ── */
.sidebar-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 20px;
}
.sidebar-card .section-header {
  margin-bottom: 12px;
}

/* WA status */
.wa-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
}
.wa-status-badge [data-lucide] { width: 14px; height: 14px; }
.wa-status-connected { color: var(--teal); }
.wa-status-pending { color: var(--accent); }
.wa-status-loading { color: var(--muted); }

#wa-qr-container {
  text-align: center;
  margin-top: 16px;
  padding: 16px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
#wa-qr-container p.qr-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 12px;
}
#wa-qr-container p.qr-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
}

/* ── WA Preview (dark phone screen) ── */
.wa-preview {
  background: #0b141a;
  border-radius: var(--radius);
  padding: 16px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  color: #e9edef;
  white-space: pre-wrap;
  line-height: 1.6;
  max-height: 480px;
  overflow-y: auto;
  border: 1px solid #1f2c34;
}
.wa-preview b { color: #00a884; font-weight: 600; }

/* ── Brief action buttons ── */
.brief-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}
.brief-actions .btn {
  width: 100%;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
}
.brief-actions .btn-send-wa {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}
.brief-actions .btn-send-wa:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

#send-status {
  margin-top: 10px;
  font-size: 12px;
  text-align: center;
  min-height: 18px;
}

/* ── Empty states ── */
.empty-state {
  color: var(--muted);
  font-size: 13px;
  padding: 20px 16px;
  text-align: center;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .container { padding: 16px; }
  .issue-table td { display: block; padding: 0; }
  .issue-table .col-actions { text-align: left; padding-top: 10px; }
  .issue-table tr { display: block; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .issue-table tr:last-child { border-bottom: none; }
  .issue-table td { border-bottom: none; }
  .wa-response-item { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">
    <i data-lucide="arrow-left"></i> Back to Portal
  </a>
  <div class="header">
    <h1 class="page-title">MP Dashboard</h1>
  </div>

  <div class="grid">
    <!-- ── Main column ── -->
    <div class="left-col">

      <!-- Pending Approvals -->
      <div class="section-block">
        <div class="section-header">
          <i data-lucide="scale"></i> Pending Approvals
        </div>
        <div class="card">
          <div id="pending-list"></div>
        </div>
      </div>

      <!-- WA Responses -->
      <div class="section-block">
        <div class="section-header">
          <i data-lucide="message-circle"></i> MP WhatsApp Responses
        </div>
        <div class="card">
          <div id="wa-responses-list"></div>
        </div>
      </div>

      <!-- News Dashboard -->
      <div class="section-block" id="news-dashboard">
        <div class="section-header">
          <i data-lucide="newspaper"></i> News Dashboard
        </div>
        <div class="card">
          <div class="nd-toolbar">
            <input type="date" class="nd-date" id="nd-date"/>
            <button class="nd-filter active" id="nd-all" onclick="ndSetFilter('all')">All</button>
            <button class="nd-filter" id="nd-national" onclick="ndSetFilter('National')">National</button>
            <button class="nd-filter" id="nd-intl" onclick="ndSetFilter('International')">International</button>
            <span class="nd-count" id="nd-count">0 reports</span>
          </div>
          <div id="nd-list"></div>
        </div>
      </div>

      <!-- Live News -->
      <div class="section-block">
        <div class="section-header">
          <i data-lucide="globe"></i> Live News
        </div>
        <div class="card">
          <div id="live-news-list"></div>
        </div>
      </div>

    </div>

    <!-- ── Sidebar ── -->
    <div class="right-col">

      <!-- WhatsApp Connection -->
      <div class="sidebar-card">
        <div class="section-header">
          <i data-lucide="smartphone"></i> WhatsApp Connection
        </div>
        <div id="wa-status-info">
          <span class="wa-status-badge wa-status-loading">
            <i data-lucide="loader"></i> Checking status...
          </span>
        </div>
        <div id="wa-qr-container" style="display:none;">
          <p class="qr-label">Scan QR code with WhatsApp</p>
          <canvas id="wa-qr-canvas" style="max-width:100%;height:auto;"></canvas>
          <p class="qr-hint">QR updates automatically</p>
        </div>
      </div>

      <!-- Brief Preview -->
      <div class="sidebar-card">
        <div class="section-header">
          <i data-lucide="file-text"></i> Daily Brief
        </div>
        <div id="brief-preview" class="wa-preview">Loading preview...</div>
        <div class="brief-actions">
          <button class="btn btn-blue" id="generate-btn" onclick="generateBrief()">
            <i data-lucide="refresh-cw"></i> Generate Brief
          </button>
          <button class="btn btn-ghost" id="copy-btn" onclick="copyBrief()" disabled>
            <i data-lucide="copy"></i> Copy Brief
          </button>
          <button class="btn btn-primary" id="approve-btn" onclick="approveBrief()" disabled>
            <i data-lucide="check"></i> Approve Brief
          </button>
          <button class="btn btn-send-wa" id="send-btn" onclick="sendToWhatsApp()" disabled>
            <i data-lucide="send"></i> Send to WhatsApp
          </button>
        </div>
        <div id="send-status"></div>
      </div>

    </div>
  </div>
</div>

<script>
async function loadData() {
  // Load Pending Approvals
  const r1 = await fetch('/api/pending-approvals');
  const d1 = await r1.json();
  let h1 = '';
  if (d1.pending.length === 0) {
    h1 = '<div class="empty-state">No pending approvals</div>';
  } else {
    h1 = '<table class="issue-table"><tbody>';
    d1.pending.forEach(iss => {
      h1 += `
      <tr>
        <td class="col-info">
          <div class="issue-type">${iss.type}</div>
          <div class="issue-meta">${iss.contact_name} · ${iss.mandal}</div>
          <div class="issue-desc">${iss.description}</div>
        </td>
        <td class="col-actions">
          <div class="btn-actions">
            <button class="btn btn-primary" onclick="actionIssue('${iss.contact_id}','${iss.id}','approved')">Approve</button>
            <button class="btn btn-destructive" onclick="actionIssue('${iss.contact_id}','${iss.id}','rejected')">Reject</button>
            <button class="btn btn-ghost" onclick="sendApprovalToWA('${iss.contact_id}','${iss.id}',this)">
              <i data-lucide="send"></i> Send to MP
            </button>
          </div>
        </td>
      </tr>`;
    });
    h1 += '</tbody></table>';
  }
  document.getElementById('pending-list').innerHTML = h1;

  // Load WhatsApp responses
  const r3 = await fetch('/api/wa-responses');
  const d3 = await r3.json();
  let h3 = '';
  if (d3.responses.length === 0) {
    h3 = '<div class="empty-state">No pending MP responses</div>';
  } else {
    d3.responses.forEach(resp => {
      h3 += `
      <div class="wa-response-item">
        <div>
          <span class="badge ${resp.mp_response === 'approved' ? 'badge-approved' : 'badge-rejected'}">${resp.mp_response.toUpperCase()}</span>
          <span style="font-weight:600;margin-left:8px;font-size:14px">${resp.issue_type}</span>
          <div class="issue-meta" style="margin-top:4px">${resp.contact_name} · MP replied: "${resp.mp_message}"</div>
          <div style="font-size:11px;color:var(--muted)">${new Date(resp.responded_at).toLocaleString('en-IN')}</div>
        </div>
        <div class="btn-actions">
          <button class="btn btn-primary" onclick="confirmWAResponse('${resp.issue_id}','approved')">Confirm</button>
          <button class="btn btn-destructive" onclick="confirmWAResponse('${resp.issue_id}','rejected')">Reject</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('wa-responses-list').innerHTML = h3;

  // Load Brief Preview
  const r2 = await fetch('/api/dashboard');
  const d2 = await r2.json();

  const preview = d2.last_brief_message || "Brief will be generated upon approval.";
  currentBriefText = d2.last_brief_message || "";
  document.getElementById('brief-preview').innerHTML = preview.replace(/\*/g, '<b>').replace(/<b>([^*]*)<\/b>/g, '<b>$1</b>');
  if (currentBriefText) {
    document.getElementById('copy-btn').disabled = false;
  }

  lucide.createIcons();
}

async function actionIssue(contact_id, issue_id, status) {
  const r = await fetch('/api/issue/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contact_id, issue_id, status})
  });
  if (r.ok) loadData();
}

let briefGenerated = false;
let briefApproved = false;
let currentBriefText = "";

function copyBrief() {
  if (!currentBriefText) return;
  navigator.clipboard.writeText(currentBriefText).then(() => {
    const btn = document.getElementById('copy-btn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="check"></i> Copied!';
    lucide.createIcons();
    setTimeout(() => {
      btn.innerHTML = originalHTML;
      lucide.createIcons();
    }, 2000);
  });
}

async function generateBrief() {
  const btn = document.getElementById('generate-btn');
  btn.disabled = true; btn.innerHTML = '<i data-lucide="loader"></i> Generating...';
  lucide.createIcons();
  const status = document.getElementById('send-status');
  status.textContent = '';
  try {
    const r = await fetch('/api/generate-brief');
    const d = await r.json();
    const preview = d.message || "Brief will be generated upon approval.";
    currentBriefText = d.message || "";
    document.getElementById('brief-preview').innerHTML = preview.replace(/\*/g, '<b>').replace(/<b>([^*]*)<\/b>/g, '<b>$1</b>');
    if (currentBriefText) {
      document.getElementById('copy-btn').disabled = false;
    }
    briefGenerated = true;
    briefApproved = false;
    document.getElementById('approve-btn').disabled = false;
    document.getElementById('send-btn').disabled = true;
    status.textContent = 'Brief generated. Review and approve below.';
    status.style.color = '#1d4ed8';
  } catch(e) {
    status.textContent = 'Failed to generate brief.';
    status.style.color = '#dc2626';
  } finally {
    btn.disabled = false; btn.innerHTML = '<i data-lucide="refresh-cw"></i> Generate Brief';
    lucide.createIcons();
  }
}

function approveBrief() {
  briefApproved = true;
  document.getElementById('approve-btn').disabled = true;
  document.getElementById('approve-btn').innerHTML = '<i data-lucide="check-circle"></i> Approved';
  document.getElementById('send-btn').disabled = false;
  const status = document.getElementById('send-status');
  status.textContent = 'Brief approved. Ready to send.';
  status.style.color = 'var(--teal)';
  lucide.createIcons();
}

async function sendToWhatsApp() {
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.innerHTML = '<i data-lucide="loader"></i> Sending...';
  lucide.createIcons();
  const status = document.getElementById('send-status');
  try {
    const r = await fetch('/api/send-brief', { method: 'POST' });
    const data = await r.json();
    status.textContent = data.status === 'sent' ? 'Sent to WhatsApp.' : 'Previewed (Module in Preview Mode).';
    status.style.color = 'var(--teal)';
    briefGenerated = false;
    briefApproved = false;
    document.getElementById('approve-btn').disabled = true;
    document.getElementById('approve-btn').innerHTML = '<i data-lucide="check"></i> Approve Brief';
  } catch(e) {
    status.textContent = 'Failed to send.';
    status.style.color = 'var(--red)';
    btn.disabled = false;
  } finally {
    btn.innerHTML = '<i data-lucide="send"></i> Send to WhatsApp';
    lucide.createIcons();
  }
}

async function checkWAStatus() {
  try {
    const r = await fetch('/api/wa-status');
    const data = await r.json();
    const info = document.getElementById('wa-status-info');
    const qrContainer = document.getElementById('wa-qr-container');
    const qrCanvas = document.getElementById('wa-qr-canvas');

    if (data.connected) {
      info.innerHTML = '<span class="wa-status-badge wa-status-connected"><i data-lucide="check-circle"></i> Connected</span>';
      qrContainer.style.display = 'none';
    } else if (data.qr) {
      info.innerHTML = '<span class="wa-status-badge wa-status-pending"><i data-lucide="alert-circle"></i> Needs Login</span>';
      qrContainer.style.display = 'block';
      QRCode.toCanvas(qrCanvas, data.qr, { width: 200, margin: 2 }, (error) => {
        if (error) console.error('QR Render Error:', error);
      });
    } else {
      info.innerHTML = '<span class="wa-status-badge wa-status-loading"><i data-lucide="loader"></i> Initializing...</span>';
      qrContainer.style.display = 'none';
    }
    lucide.createIcons();
  } catch (e) {
    console.error('WA Status Error:', e);
  }
}

async function sendApprovalToWA(contact_id, issue_id, btn) {
  btn.disabled = true; btn.innerHTML = '<i data-lucide="loader"></i> Sending...';
  lucide.createIcons();
  try {
    const r = await fetch('/api/send-approval-request', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ contact_id, issue_id })
    });
    const data = await r.json();
    btn.innerHTML = data.log.status === 'sent' ? '<i data-lucide="check"></i> Sent' : '<i data-lucide="clipboard"></i> Previewed';
    btn.style.color = 'var(--teal)';
    btn.style.borderColor = 'var(--teal)';
    lucide.createIcons();
  } catch(e) {
    btn.innerHTML = '<i data-lucide="x"></i> Failed';
    btn.disabled = false;
    lucide.createIcons();
  }
}

async function confirmWAResponse(issue_id, action) {
  const r = await fetch('/api/wa-response/confirm', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ issue_id, action })
  });
  if (r.ok) loadData();
}

async function loadLiveNews() {
  try {
    const r = await fetch('/api/live-news');
    const data = await r.json();
    let html = '';
    if (!data.news || data.news.length === 0) {
      html = '<div class="empty-state">No live news available</div>';
    } else {
      data.news.slice(0, 20).forEach((n, i) => {
        const date = n.pubDate ? new Date(n.pubDate).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
        const href = n.link;
        const itemId = `live-news-extract-${i}`;
        html += `
        <div class="live-news-item">
          <a href="${href}" target="_blank" rel="noopener">${n.title}</a>
          <div class="news-meta">${n.source || ''}${n.source && date ? ' · ' : ''}${date}${n.mandal_tag ? ' · ' + n.mandal_tag : ''}${n.lang === 'te' ? ' · తెలుగు' : ''}
            &nbsp;·&nbsp;<a href="#" onclick="fetchFullArticle('${itemId}','${href.replace(/'/g, "%27")}');return false;" style="color:#b45309">Fetch full text</a>
          </div>
          <div id="${itemId}" class="news-body" style="display:none"></div>
        </div>`;
      });
    }
    document.getElementById('live-news-list').innerHTML = html;
    lucide.createIcons();
  } catch(e) {
    document.getElementById('live-news-list').innerHTML = '<div class="empty-state">Failed to load live news</div>';
  }
}

async function fetchFullArticle(elId, link) {
  const el = document.getElementById(elId);
  el.style.display = 'block';
  el.textContent = 'Fetching full article…';
  try {
    const r = await fetch(`/api/live-news/extract?link=${encodeURIComponent(link)}`);
    const data = await r.json();
    if (!data.ok) { el.textContent = data.error || 'Could not fetch full article.'; return; }
    el.textContent = data.text;
  } catch (e) {
    el.textContent = 'Could not fetch full article.';
  }
}

// ── News Dashboard ────────────────────────────────────────────────────────
let ndAllNews = [];
let ndCategory = 'all';

function ndTodayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}
function ndFmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });
}
function ndEsc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ndRender() {
  const filtered = ndCategory === 'all'
    ? ndAllNews
    : ndAllNews.filter(n => n.mandal === ndCategory);

  document.getElementById('nd-count').textContent =
    `${filtered.length} report${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    document.getElementById('nd-list').innerHTML =
      '<div class="empty-state">No news reports for this date</div>';
    return;
  }

  document.getElementById('nd-list').innerHTML = filtered.map(n => {
    const cat = n.mandal || '';
    const badgeCls = cat === 'National' ? 'cat-national' : cat === 'International' ? 'cat-international' : 'cat-other';
    const hasLink = n.link && n.link.startsWith('http');
    return `
    <div class="nd-card">
      <div class="nd-card-top">
        <span class="cat-badge ${badgeCls}">${ndEsc(cat) || 'Report'}</span>
        <div class="nd-headline">${ndEsc(n.headline)}</div>
      </div>
      ${n.body ? `<div class="nd-body">${ndEsc(n.body)}</div>` : ''}
      <div class="nd-meta">
        ${n.source ? `<span><i data-lucide="building-2"></i>${ndEsc(n.source)}</span>` : ''}
        ${n.submitted_at ? `<span><i data-lucide="clock"></i>${ndFmtTime(n.submitted_at)}</span>` : ''}
      </div>
      ${hasLink ? `<a class="nd-link" href="${n.link.replace(/"/g,'%22')}" target="_blank" rel="noopener">
        Read full article <i data-lucide="external-link"></i>
      </a>` : ''}
    </div>`;
  }).join('');

  lucide.createIcons();
}

async function loadNewsDashboard() {
  const date = document.getElementById('nd-date').value;
  const url = date ? `/api/news?date=${date}` : '/api/news';
  try {
    const r = await fetch(url);
    const data = await r.json();
    ndAllNews = data.news || [];
    ndRender();
  } catch(e) {
    document.getElementById('nd-list').innerHTML =
      '<div class="empty-state">Failed to load news</div>';
  }
}

function ndSetFilter(cat) {
  ndCategory = cat;
  ['nd-all','nd-national','nd-intl'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
  const map = { all:'nd-all', National:'nd-national', International:'nd-intl' };
  if (map[cat]) document.getElementById(map[cat]).classList.add('active');
  ndRender();
}

document.getElementById('nd-date').value = ndTodayIST();
document.getElementById('nd-date').addEventListener('change', loadNewsDashboard);

// ── Initialize
lucide.createIcons();
loadData();
loadLiveNews();
loadNewsDashboard();
checkWAStatus();
setInterval(checkWAStatus, 5000);
setInterval(loadLiveNews, 5 * 60 * 1000);
</script>
