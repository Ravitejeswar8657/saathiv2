<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MP Dashboard · Saathi Palanadu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1208;--paper:#fffbeb;--cream:#fef3c7;--rust:#b45309;
  --white:#fff;--border:#e7e5e4;--muted:#78716c;--teal:#0f766e;--teal-l:#ccfbf1;
}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);padding:clamp(16px, 4vw, 40px) 16px; min-height: 100vh;}
.container{max-width:1000px;margin:0 auto}
.header{margin-bottom:30px}
.page-title{font-family:'Fraunces',serif;font-size:clamp(24px, 6vw, 32px);font-weight:600}
.back-link{font-size:14px;color:var(--rust);text-decoration:none;font-weight:600;margin-bottom:8px;display:block}
.grid{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width: 900px) { .grid { grid-template-columns: 1fr 400px; } }
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:clamp(16px, 4vw, 24px);margin-bottom:20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.issue-row{display:flex;flex-direction:column;gap:16px;padding:20px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;background:var(--white); transition: 0.2s;}
@media(min-width: 480px) { .issue-row { flex-direction: row; justify-content: space-between; align-items: center; } }
.issue-row:hover { border-color: var(--teal); }
.btn{padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;border:none;font-size:14px; transition: 0.2s;}
.btn-approve{background:var(--teal);color:#fff; box-shadow: 0 4px 6px rgba(15,118,110,0.2);}
.btn-approve:active { transform: scale(0.95); }
.btn-reject{background:#fef2f2;color:#991b1b; border: 1px solid #fecaca;}
.wa-preview{background:#0b141a;border-radius:16px;padding:20px;font-family:monospace;font-size:13px;color:#e9edef;white-space:pre-wrap;line-height:1.6;max-height:600px;overflow-y:auto; border: 4px solid #202c33;}
.wa-preview b{color:#00a884; font-weight: bold;}
.send-btn{width:100%;padding:18px;background:var(--rust);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:16px; box-shadow: 0 10px 15px -3px rgba(180,83,9,0.3); transition: 0.2s;}
.send-btn:active { transform: scale(0.98); background: var(--ink); }
.send-btn:disabled{background:var(--muted);cursor:not-allowed}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">← Back to Portal</a>
  <div class="header">
    <div style="font-size:12px;font-weight:600;color:var(--rust);text-transform:uppercase;letter-spacing:1px">Strategic Command</div>
    <h1 class="page-title">MP Dashboard</h1>
  </div>

  <div class="grid">
    <div class="left-col">
      <div class="section-title">⚖️ Pending Approvals (Letters & TTD)</div>
      <div id="pending-list"></div>

      <div class="section-title" style="margin-top:40px">📰 Field Intelligence (Latest News)</div>
      <div id="news-list"></div>
    </div>

    <div class="right-col">
      <div class="section-title">📱 Final Brief Approval</div>
      <div class="card" style="padding:10px">
        <div id="brief-preview" class="wa-preview">Loading preview...</div>
        <button class="send-btn" id="send-btn" onclick="approveAndSend()">Approve & Send to WhatsApp →</button>
        <div id="send-status" style="margin-top:10px;font-size:13px;text-align:center"></div>
      </div>
    </div>
  </div>
</div>

<script>
async function loadData() {
  // Load Pending Approvals
  const r1 = await fetch('/api/pending-approvals');
  const d1 = await r1.json();
  let h1 = '';
  if (d1.pending.length === 0) h1 = '<p style="color:var(--muted);font-size:13px">No pending approvals.</p>';
  d1.pending.forEach(iss => {
    h1 += `
    <div class="issue-row">
      <div>
        <div style="font-weight:700">${iss.type}</div>
        <div style="font-size:12px;color:var(--muted)">For ${iss.contact_name} (${iss.mandal})</div>
        <div style="font-size:13px;margin-top:6px">${iss.description}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-approve" onclick="actionIssue('${iss.contact_id}','${iss.id}','approved')">Approve</button>
        <button class="btn btn-reject" onclick="actionIssue('${iss.contact_id}','${iss.id}','rejected')">Reject</button>
      </div>
    </div>`;
  });
  document.getElementById('pending-list').innerHTML = h1;

  // Load News & Brief Preview
  const r2 = await fetch('/api/dashboard');
  const d2 = await r2.json();
  
  let h2 = '';
  (d2.news || []).slice(0, 5).forEach(n => {
    h2 += `
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="font-weight:600">${n.headline}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${n.source} · ${n.mandal}</div>
      <div style="font-size:13px;margin-top:6px">${n.body}</div>
    </div>`;
  });
  document.getElementById('news-list').innerHTML = h2;

  // Brief Preview
  const preview = d2.last_brief_message || "Brief will be generated upon approval.";
  document.getElementById('brief-preview').innerHTML = preview.replace(/\*/g, '<b>').replace(/<b>([^*]*)<\/b>/g, '<b>$1</b>');
}

async function actionIssue(contact_id, issue_id, status) {
  const r = await fetch('/api/issue/approve', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contact_id, issue_id, status})
  });
  if (r.ok) loadData();
}

async function approveAndSend() {
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const r = await fetch('/api/send-brief', { method: 'POST' });
    const data = await r.json();
    document.getElementById('send-status').textContent = data.status === 'sent' ? '✅ Sent to WhatsApp!' : '✅ Previewed (Module in Preview Mode)';
    document.getElementById('send-status').style.color = 'var(--teal)';
  } catch(e) {
    document.getElementById('send-status').textContent = '❌ Failed to send';
    document.getElementById('send-status').style.color = '#dc2626';
  } finally {
    btn.disabled = false; btn.textContent = 'Approve & Send to WhatsApp →';
  }
}

loadData();
</script>
</body>
</html>
