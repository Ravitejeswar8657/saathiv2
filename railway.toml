# DOCKERFILE rather than NIXPACKS: better-sqlite3 is a native addon, and the
# Nixpacks image has no Python for node-gyp's fallback, so a Node version without
# a published prebuilt binary failed the build outright. See ./Dockerfile.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
name = "saathi-data"
mountPath = "/data"
